/* =====================================================

===================================================== */

function updateStats(){

    const total =
        products.length;


    const available =
        products.filter(
            p =>
                Number(p.quantity) > 0
        ).length;


    const totalElement =
        document.getElementById(
            "totalProducts"
        );


    const availableElement =
        document.getElementById(
            "availableProducts"
        );


    if(totalElement){

        totalElement.textContent =
            total;

    }


    if(availableElement){

        availableElement.textContent =
            available;

    }


    updateOrderStats();

}


/* =====================================================
   FIRESTORE - الطلبات
===================================================== */


/*
    هذه الدالة تبدأ مراقبة Collection اسمها:

    orders

    أي طلب جديد أو تغيير حالة أو حذف
    سيظهر في لوحة الإدارة تلقائياً.
*/

function startOrdersListener(){

    if(ordersUnsubscribe){

        ordersUnsubscribe();

        ordersUnsubscribe = null;

    }


    console.log(
        "بدء الاتصال بـ Firestore..."
    );


    ordersUnsubscribe =
        db.collection(
            ORDERS_COLLECTION
        )
        .onSnapshot(

            async snapshot => {

                const orders = [];


                snapshot.forEach(
                    doc => {

                        const data =
                            doc.data();


                        orders.push({

                            ...data,

                            id:
                                data.id ||
                                doc.id

                        });

                    }
                );


                /*
                    ترتيب الأحدث أولاً
                */

                orders.sort(
                    (a,b) => {

                        const dateA =
                            new Date(
                                a.createdAt ||
                                a.date ||
                                0
                            ).getTime();


                        const dateB =
                            new Date(
                                b.createdAt ||
                                b.date ||
                                0
                            ).getTime();


                        return dateB - dateA;

                    }
                );


                firestoreOrders =
                    orders;


                ordersLoaded =
                    true;


                /*
                    نحفظ نسخة محلية أيضاً
                    كنسخة احتياطية
                */

                localStorage.setItem(
                    ORDERS_KEY,
                    JSON.stringify(
                        firestoreOrders
                    )
                );


                renderOrders();

                updateOrderStats();


                console.log(
                    "Firestore orders:",
                    firestoreOrders
                );


                /*
                    إذا Firestore فارغ
                    وكانت هناك طلبات قديمة في LocalStorage
                    نحاول نقلها إلى Firestore
                */

                if(
                    snapshot.empty
                ){

                    await migrateOldOrders();

                }

            },

            error => {

                console.error(
                    "Firestore error:",
                    error
                );


                ordersLoaded =
                    false;


                /*
                    في حالة وجود مشكلة
                    نرجع للنسخة المحلية
                */

                try{

                    firestoreOrders =
                        JSON.parse(
                            localStorage.getItem(
                                ORDERS_KEY
                            )
                        ) || [];

                }catch(e){

                    firestoreOrders = [];

                }


                renderOrders();

                updateOrderStats();


                alert(
                    "تعذر الاتصال بقاعدة البيانات حالياً، سيتم عرض النسخة المحلية."
                );

            }

        );

}


/* =====================================================
   نقل الطلبات القديمة من LocalStorage
   إلى Firestore
===================================================== */

async function migrateOldOrders(){

    let localOrders = [];


    try{

        localOrders =
            JSON.parse(
                localStorage.getItem(
                    ORDERS_KEY
                )
            ) || [];

    }catch(e){

        localOrders = [];

    }


    if(
        !Array.isArray(localOrders) ||
        localOrders.length === 0
    ){

        return;

    }


    console.log(
        "محاولة نقل الطلبات القديمة إلى Firestore..."
    );


    let migrated =
        0;


    for(
        const order of localOrders
    ){

        if(!order){

            continue;

        }


        const orderId =
            String(
                order.id ||
                generateOrderId()
            );


        try{

            await db
                .collection(
                    ORDERS_COLLECTION
                )
                .doc(orderId)
                .set({

                    ...order,

                    id:
                        orderId,

                    migratedAt:
                        new Date().toISOString()

                }, {

                    merge:true

                });


            migrated++;

        }catch(error){

            console.error(
                "فشل نقل الطلب:",
                orderId,
                error
            );

        }

    }


    if(migrated > 0){

        console.log(
            "تم نقل " +
            migrated +
            " طلب إلى Firestore."
        );

    }

}


/* =====================================================
   توليد ID احتياطي
===================================================== */

function generateOrderId(){

    return (
        "LYB-" +
        Date.now() +
        "-" +
        Math.floor(
            1000 +
            Math.random() *
            9000
        )
    );

}


/* =====================================================
   getOrders
===================================================== */

function getOrders(){

    /*
        إذا Firestore اشتغل،
        نستخدم بيانات Firestore.
    */

    if(ordersLoaded){

        return firestoreOrders;

    }


    /*
        fallback إلى LocalStorage
    */

    try{

        const data =
            localStorage.getItem(
                ORDERS_KEY
            );


        if(!data){

            return [];

        }


        const parsed =
            JSON.parse(data);


        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        return [];

    }

}


/* =====================================================
   saveOrders
   نحتفظ بها للتوافق مع النظام القديم
===================================================== */

function saveOrders(orders){

    localStorage.setItem(
        ORDERS_KEY,
        JSON.stringify(orders)
    );


    firestoreOrders =
        Array.isArray(orders)
        ? orders
        : [];

}


/* =====================================================
   الإحصائيات
===================================================== */

function updateOrderStats(){

    const orders =
        getOrders();


    const newOrders =
        orders.filter(
            order =>
                normalizeStatus(
                    order.status
                ) ===
                "جديد"
        ).length;


    const sales =
        orders.reduce(
            (sum, order) => {

                return (
                    sum +
                    Number(
                        order.total || 0
                    )
                );

            },
            0
        );


    const newElement =
        document.getElementById(
            "newOrders"
        );


    const salesElement =
        document.getElementById(
            "salesValue"
        );


    if(newElement){

        newElement.textContent =
            newOrders;

    }


    if(salesElement){

        salesElement.textContent =
            sales.toFixed(2) +
            " د.ل";

    }


    const badge =
        document.getElementById(
            "ordersBadge"
        );


    if(badge){

        badge.textContent =
            newOrders > 0
            ? "(" + newOrders + ")"
            : "";

    }

}


/* =====================================================
   توحيد الحالات
===================================================== */

function normalizeStatus(status){

    const value =
        String(
            status ||
            "جديد"
        ).trim();


    if(value === "جديد"){

        return "جديد";

    }


    if(
        value === "مؤكد" ||
        value === "تم التأكيد"
    ){

        return "تم التأكيد";

    }


    if(
        value === "قيد التجهيز" ||
        value === "جاري التجهيز"
    ){

        return "قيد التجهيز";

    }


    if(value === "جاهز"){

        return "جاهز";

    }


    if(
        value === "في الشحن" ||
        value === "شحن"
    ){

        return "في الشحن";

    }


    if(
        value === "تم التسليم" ||
        value === "مكتمل"
    ){

        return "تم التسليم";

    }


    if(
        value === "ملغي" ||
        value === "ملغى"
    ){

        return "ملغي";

    }


    return value;

}


/* =====================================================
   العميل
===================================================== */

function getCustomerName(order){

    return (
        order.customerName ||
        order.name ||
        "-"
    );

}


function getCustomerPhone(order){

    return (
        order.customerPhone ||
        order.phone ||
        "-"
    );

}


/* =====================================================
   عرض الطلبات
===================================================== */

function renderOrders(){

    const container =
        document.getElementById(
            "ordersList"
        );


    if(!container){

        return;

    }


    const searchInput =
        document.getElementById(
            "searchOrders"
        );


    const search =
        searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    const orders =
        getOrders();


    const filtered =
        orders.filter(
            order => {

                const text =
                    (

                        String(
                            order.id || ""
                        ) +

                        " " +

                        String(
                            getCustomerName(
                                order
                            )
                        ) +

                        " " +

                        String(
                            getCustomerPhone(
                                order
                            )
                        ) +

                        " " +

                        String(
                            order.city || ""
                        ) +

                        " " +

                        String(
                            order.address || ""
                        )

                    )
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                ${
                    ordersLoaded
                    ?
                    "🛒 لا توجد طلبات حالياً"
                    :
                    "⏳ جاري تحميل الطلبات..."
                }

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(
            order =>
                createOrderCard(
                    order
                )
        ).join("");

}


/* =====================================================
   أيقونة الحالة
===================================================== */

function getStatusIcon(status){

    const normalized =
        normalizeStatus(
            status
        );


    if(normalized === "جديد"){

        return "🆕";

    }


    if(normalized === "تم التأكيد"){

        return "👍";

    }


    if(normalized === "قيد التجهيز"){

        return "🔧";

    }


    if(normalized === "جاهز"){

        return "📦";

    }


    if(normalized === "في الشحن"){

        return "🚚";

    }


    if(normalized === "تم التسليم"){

        return "✅";

    }


    if(normalized === "ملغي"){

        return "❌";

    }


    return "📌";

}

/* =====================================================
   تغيير حالة الطلب
===================================================== */

async function changeOrderStatus(
    orderId,
    status
){

    const normalized =
        normalizeStatus(
            status
        );


    const orders =
        getOrders();


    const index =
        orders.findIndex(
            order =>
                String(
                    order.id
                ) ===
                String(
                    orderId
                )
        );


    /*
        نحدث الواجهة المحلية مباشرة
    */

    if(index !== -1){

        orders[index].status =
            normalized;


        orders[index].updatedAt =
            new Date().toISOString();


        firestoreOrders =
            orders;


        localStorage.setItem(
            ORDERS_KEY,
            JSON.stringify(
                firestoreOrders
            )
        );


        renderOrders();

        updateOrderStats();

    }


    /*
        الحفظ الحقيقي في Firestore
    */

    try{

        await db
            .collection(
                ORDERS_COLLECTION
            )
            .doc(
                String(
                    orderId
                )
            )
            .set({

                status:
                    normalized,

                updatedAt:
                    new Date().toISOString()

            }, {

                merge:true

            });


        alert(
            "تم تحديث حالة الطلب إلى: " +
            normalized +
            " ✅"
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "حدث خطأ أثناء تحديث الطلب في Firestore ❌\n\n" +
            "تأكد من اتصال الإنترنت وقواعد Firestore."
        );

    }

}


/* =====================================================
   حذف الطلب
===================================================== */

async function deleteOrder(
    orderId
){

    const orders =
        getOrders();


    const order =
        orders.find(
            item =>
                String(
                    item.id
                ) ===
                String(
                    orderId
                )
        );


    if(!order){

        return;

    }


    if(
        !confirm(
            "هل أنت متأكد من حذف الطلب:\n\n" +
            order.id +
            "\n\nلا يمكن التراجع عن هذه العملية."
        )
    ){

        return;

    }


    try{

        /*
            حذف من Firestore
        */

        await db
            .collection(
                ORDERS_COLLECTION
            )
            .doc(
                String(
                    orderId
                )
            )
            .delete();


        /*
            حذف من النسخة المحلية
        */

        firestoreOrders =
            firestoreOrders.filter(
                item =>
                    String(
                        item.id
                    ) !==
                    String(
                        orderId
                    )
            );


        localStorage.setItem(
            ORDERS_KEY,
            JSON.stringify(
                firestoreOrders
            )
        );


        renderOrders();

        updateOrderStats();


        alert(
            "تم حذف الطلب من قاعدة البيانات ✅"
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "حدث خطأ أثناء حذف الطلب ❌"
        );

    }

}

/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

    const product =
        products.find(
            p =>
                String(
                    p.id
                ) ===
                String(
                    id
                )
        );


    if(!product){

        return;

    }


    editingId =
        id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "✏️ تعديل المنتج";


    document.getElementById(
        "productId"
    ).value =
        product.id;


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || 0;


    document.getElementById(
        "productQuantity"
    ).value =
        product.quantity || 0;


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "productSizes"
    ).value =
        Array.isArray(
            product.sizes
        )
        ? product.sizes.join(", ")
        : product.sizes || "";


    document.getElementById(
        "productColors"
    ).value =
        Array.isArray(
            product.colors
        )
        ? product.colors.join(", ")
        : product.colors || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    selectedImage =
        product.image || "";


    if(product.image){

        document.getElementById(
            "previewImg"
        ).src =
            product.image;


        document.getElementById(
            "imagePreview"
        ).style.display =
            "block";

    }else{

        document.getElementById(
            "imagePreview"
        ).style.display =
            "none";

    }


    document.getElementById(
        "productModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   IMAGE
===================================================== */

document.getElementById(
    "productImage"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                selectedImage =
                    e.target.result;


                document.getElementById(
                    "previewImg"
                ).src =
                    selectedImage;


                document.getElementById(
                    "imagePreview"
                ).style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =====================================================
   SAVE PRODUCT
===================================================== */

document.getElementById(
    "productForm"
).addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const price =
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            );


        const quantity =
            Number(
                document.getElementById(
                    "productQuantity"
                ).value
            );


        const category =
            document.getElementById(
                "productCategory"
            ).value;


        const sizes =
            document.getElementById(
                "productSizes"
            ).value
            .split(",")
            .map(
                x =>
                    x.trim()
            )
            .filter(Boolean);


        const colors =
            document.getElementById(
                "productColors"
            ).value
            .split(",")
            .map(
                x =>
                    x.trim()
            )
            .filter(Boolean);


        const description =
            document.getElementById(
                "productDescription"
            ).value.trim();


        if(!name){

            alert(
                "اكتب اسم المنتج"
            );

            return;

        }


        if(
            price < 0 ||
            quantity < 0
        ){

            alert(
                "السعر والكمية يجب ألا تكون سالبة"
            );

            return;

        }


        if(editingId){

            const index =
                products.findIndex(
                    p =>
                        String(
                            p.id
                        ) ===
                        String(
                            editingId
                        )
                );


            if(index !== -1){

                products[index] = {

                    ...products[index],

                    name,

                    price,

                    quantity,

                    category,

                    sizes,

                    colors,

                    description,

                    image:
                        selectedImage

                };

            }

        }else{

            products.unshift({

                id:
                    Date.now().toString(),

                name,

                price,

                quantity,

                category,

                sizes,

                colors,

                description,

                image:
                    selectedImage

            });

        }


        saveProducts();

        closeProductModal();

        loadProducts();


        alert(
            editingId
            ? "تم تعديل المنتج بنجاح ✅"
            : "تمت إضافة المنتج بنجاح ✅"
        );

    }
);

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(
        text || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(text){

    return String(
        text || ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}
