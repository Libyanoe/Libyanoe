*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7fa;
    color:#18202a;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#111827,#1f2937);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    text-align:center;
}

.login-box h1{
    margin-bottom:10px;
}

.login-box p{
    color:#6b7280;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:12px;
    font-size:16px;
    text-align:center;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.login-btn:active{
    transform:scale(.98);
}

.login-error{
    color:#dc2626;
    margin-top:12px;
    display:none;
}


/* =========================
   DASHBOARD
========================= */

.dashboard{
    min-height:100vh;
    display:flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:250px;
    background:#111827;
    color:white;
    min-height:100vh;
    padding:20px;
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
    text-align:center;
    padding:15px 5px 25px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    width:100%;
    border:none;
    background:transparent;
    color:#d1d5db;
    padding:13px;
    border-radius:10px;
    text-align:right;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#374151;
    color:white;
}

.menu .add-btn{
    background:#2563eb;
    color:white;
    margin-top:10px;
}

.menu .store-btn{
    margin-top:10px;
    background:#059669;
    color:white;
}

.menu .logout-btn{
    margin-top:10px;
    background:#dc2626;
    color:white;
}


/* =========================
   MAIN
========================= */

.main{
    flex:1;
    margin-right:250px;
    padding:25px;
}

.topbar{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.topbar h1{
    font-size:24px;
}

.firebase-status{
    font-size:13px;
    color:#059669;
    background:#ecfdf5;
    padding:7px 12px;
    border-radius:20px;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat-card .icon{
    font-size:28px;
    margin-bottom:8px;
}

.stat-card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:7px;
}

.stat-card strong{
    font-size:25px;
}


/* =========================
   SECTIONS
========================= */

.section{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.section-header h2{
    font-size:20px;
}

.search-box{
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    min-width:250px;
    outline:none;
}

.search-box:focus{
    border-color:#2563eb;
}


/* =========================
   PRODUCTS
========================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
}

.product-card{
    border:1px solid #e5e7eb;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product-image{
    height:200px;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-content{
    padding:15px;
}

.product-content h3{
    margin-bottom:8px;
}

.product-price{
    font-weight:bold;
    font-size:18px;
    margin-bottom:6px;
}

.product-stock{
    color:#6b7280;
    font-size:14px;
    margin-bottom:10px;
}

.product-category{
    display:inline-block;
    background:#eef2ff;
    color:#3730a3;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    margin-bottom:10px;
}

.product-actions{
    display:flex;
    gap:8px;
}

.product-actions button{
    flex:1;
    border:none;
    border-radius:9px;
    padding:10px;
    font-weight:bold;
}

.edit-btn{
    background:#e0f2fe;
    color:#0369a1;
}

.delete-btn{
    background:#fee2e2;
    color:#b91c1c;
}


/* =========================
   ORDERS
========================= */

.orders-list{

    flex-direction:column;
    gap:15px;
}

.order-card{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:18px;
}

.order-header{

    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.order-number{
    font-weight:bold;
    font-size:18px;
}

.order-date{

    font-size:13px;

.order-customer{

    margin-bottom:15px;

.order-items{

    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

.order-item{

    align-items:center;
    gap:12px;
    padding:10px;
    background:#f9fafb;
    border-radius:10px;
}

.order-item img{

    height:55px;

    border-radius:8px;
    background:#eee;

.order-item-info{

}

.order-item-info strong{

    margin-bottom:3px;
}

.order-item-info small{
    color:#6b7280;
}

.order-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-top:1px solid #eee;
    padding-top:15px;
    flex-wrap:wrap;
}

.order-total{
    font-size:18px;
    font-weight:bold;
}

.status-select{

    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    min-width:170px;

    background:#fee2e2;
    color:#b91c1c;
    padding:10px 13px;

    font-weight:bold;

/* =========================
   STATUS
========================= */

.status-badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#f3f4f6;
    font-size:13px;
    font-weight:bold;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:500;

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close-modal{
    border:none;
    background:#f3f4f6;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.preview{
    margin-top:10px;
    width:120px;
    height:120px;
    border-radius:10px;
    overflow:hidden;
    background:#f3f4f6;
    display:none;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.save-product{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}


/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:40px 20px;
    color:#6b7280;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .sidebar{
        width:210px;
    }

    .main{
        margin-right:210px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .dashboard{
        display:block;
    }

    .sidebar{
        position:relative;
        width:100%;
        min-height:auto;
    }

    .main{
        margin-right:0;
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .search-box{
        min-width:100%;
    }

    .form-row{
        grid-template-columns:1fr;
    }

}

@media(max-width:450px){

    .stats{
        grid-template-columns:1fr;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .order-footer{
        align-items:stretch;
        flex-direction:column;
    }

    .status-select{
        width:100%;
    }

}

/* =====================================================

===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


function formatPrice(value){

    return Number(value || 0)
        .toLocaleString("ar-LY",{
            minimumFractionDigits:0,
            maximumFractionDigits:2
        });

}


function getOrderTime(value){

    if(!value){
        return 0;
    }

    if(
        value &&
        typeof value.toDate === "function"
    ){

        return value.toDate().getTime();

    }

    const time =
        new Date(value).getTime();

    return isNaN(time)
        ? 0
        : time;

}


function formatDate(value){

    const time =
        getOrderTime(value);

    if(!time){
        return "بدون تاريخ";
    }

    return new Date(time)
        .toLocaleString("ar-LY");

}

function initializeFirebase(){

    try{

        ){

            );

        }

        if(
            !firebase.apps.length
        ){

            firebase.initializeApp(

            );

        }

        db =

        setFirebaseStatus(

        );

        db = null;

        setFirebaseStatus(
            "🟠 التخزين المحلي"
        );

    }

}

function login(){

    try{

        const input =
            document.getElementById(
                "password"
            );

        const error =
            document.getElementById(
                "loginError"
            );


        const password =
            input.value.trim();


        if(password === PASSWORD){

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            error.style.display =

            showDashboard();

        }else{

            error.style.display =
                "block";

            input.value = "";

            input.focus();

        }

    }catch(error){

        console.error(
            "Login error:",
            error
        );

        alert(
            "حدث خطأ في تسجيل الدخول."
        );

    }

}

/* =====================================================

===================================================== */

function previewImage(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){
        return;
    }


    if(!file.type.startsWith("image/")){

        alert(
            "اختر صورة صحيحة."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            document.getElementById(
                "previewImg"
            ).src =
                event.target.result;

            document.getElementById(
                "imagePreview"
            ).style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

function saveProduct(event){

    event.preventDefault();


    const id =
        document
            .getElementById(
                "productId"
            )
            .value
            .trim();


    const name =
        document
            .getElementById(
                "productName"
            )
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById(
                    "productPrice"
                )
                .value
        );


    const quantity =
        Number(
            document
                .getElementById(
                    "productQuantity"
                )
                .value
        );


    const category =
        document
            .getElementById(
                "productCategory"
            )
            .value
            .trim();


    const sizesText =
        document
            .getElementById(
                "productSizes"
            )
            .value
            .trim();


    const colorsText =
        document
            .getElementById(
                "productColors"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "productDescription"
            )
            .value
            .trim();


    if(!name){

        alert(
            "اكتب اسم المنتج."
        );

        return;

    }


    if(price < 0 || quantity < 0){

        alert(
            "السعر والكمية يجب أن تكون أرقامًا صحيحة."
        );

        return;

    }


    const products =
        getProducts();


    const existingIndex =
        products.findIndex(
            product =>
                String(product.id)
                ===
                String(id)
        );


    let image = "";


    const previewImg =
        document.getElementById(
            "previewImg"
        );


    if(
        previewImg &&
        previewImg.src &&
        previewImg.src !==
            window.location.href
    ){

        image =
            previewImg.src;

    }


    if(
        existingIndex !== -1 &&
        !image
    ){

        image =
            products[
                existingIndex
            ].image || "";

    }


    const product = {

        id:
            id ||
            generateProductId(),

        name:

            name,

        price:

            price,

        quantity:

            quantity,

        category:

            category,

        sizes:

            sizesText
            ?
            sizesText
                .split(",")
                .map(
                    value =>
                        value.trim()
                )
                .filter(Boolean)
            :
            [
                "S",
                "M",
                "L",
                "XL"
            ],

        colors:

            colorsText
            ?
            colorsText
                .split(",")
                .map(
                    value =>
                        value.trim()
                )
                .filter(Boolean)
            :
            [
                "أسود",
                "أبيض"
            ],

        description:

            description,

        image:

            image

    };


    if(existingIndex !== -1){

        products[
            existingIndex
        ] =
            product;

    }else{

        products.push(
            product
        );

    }


    saveProducts(
        products
    );


    closeProductModal();

    renderProducts();

    updateStats();


    alert(
        existingIndex !== -1
        ?
        "تم تعديل المنتج ✅"
        :
        "تمت إضافة المنتج ✅"
    );

}


function generateProductId(){

    return (
        "product_"
        +
        Date.now()
        +
        "_"
        +
        Math.random()
            .toString(36)
            .slice(2,8)
    );

}

function deleteProduct(id){

    const products =
        getProducts();


    const product =
        products.find(

                ===

/* =====================================================
   FIRESTORE LISTENER
===================================================== */

function startOrdersListener(){

    if(!db){

        setFirebaseStatus(
            "🟠 التخزين المحلي"
        );

        return;

    }


    if(ordersUnsubscribe){

        ordersUnsubscribe();

        ordersUnsubscribe =
            null;

    }


    setFirebaseStatus(
        "🔄 تحميل الطلبات..."
    );


    try{

        ordersUnsubscribe =
            db
                .collection("orders")
                .onSnapshot(

                    snapshot => {

                        firestoreOrders =
                            snapshot.docs.map(
                                doc => {

                                    return {
                                        id:doc.id,
                                        ...doc.data()
                                    };

                                }
                            );


                        firestoreOrders.sort(
                            (a,b) =>
                                getOrderTime(
                                    b.createdAt ||
                                    b.date
                                )
                                -
                                getOrderTime(
                                    a.createdAt ||
                                    a.date
                                )
                        );


                        firestoreOrdersLoaded =
                            true;


                        saveLocalOrders(
                            firestoreOrders
                        );


                        setFirebaseStatus(
                            "🟢 Firestore متصل"
                        );


                        renderOrders();

                        updateOrderStats();

                    },

                    error => {

                        console.error(
                            "Firestore listener:",
                            error
                        );


                        firestoreOrdersLoaded =
                            false;


                        setFirebaseStatus(
                            "🔴 خطأ Firestore - التخزين المحلي"
                        );


                        renderOrders();

                        updateOrderStats();

                    }

                );

    }catch(error){

        console.error(error);

        firestoreOrdersLoaded =
            false;

        renderOrders();

        updateOrderStats();

    }

}


/* =====================================================
   ORDER STATUS
===================================================== */

function normalizeStatus(
    status
){

    const value =
        String(
            status || ""
        )
        .trim()
        .toLowerCase();


    const map = {

        "جديد":
            "pending",

        "قيد المراجعة":
            "pending",

        "pending":
            "pending",

        "تم التأكيد":
            "confirmed",

        "confirmed":
            "confirmed",

        "قيد التجهيز":
            "preparing",

        "جاري التجهيز":
            "preparing",

        "preparing":
            "preparing",

        "جاهز":
            "ready",

        "ready":
            "ready",

        "في الشحن":
            "shipping",

        "في التوصيل":
            "shipping",

        "shipping":
            "shipping",

        "تم التسليم":
            "delivered",

        "delivered":
            "delivered",

        "ملغي":
            "cancelled",

        "ملغى":
            "cancelled",

        "cancelled":
            "cancelled"

    };


    return (
        map[value]
        ||
        "pending"
    );

}


function getStatusText(
    status
){

    const normalized =
        normalizeStatus(
            status
        );


    const map = {

        pending:
            "⏳ قيد المراجعة",

        confirmed:
            "✅ تم التأكيد",

        preparing:
            "📦 قيد التجهيز",

        ready:
            "🟢 جاهز",

        shipping:
            "🚚 في التوصيل",

        delivered:
            "🎉 تم التسليم",

        cancelled:
            "❌ ملغي"

    };


    return (
        map[normalized]
        ||
        "⏳ قيد المراجعة"
    );

}

/* =====================================================
   CHANGE ORDER STATUS
===================================================== */

async function changeOrderStatus(
    orderId,
    newStatus
){

    const normalized =
        normalizeStatus(
            newStatus
        );


    const orders =
        getOrders();


    const index =
        orders.findIndex(
            order =>
                String(order.id)
                ===
                String(orderId)
        );


    if(index === -1){

        alert(
            "لم يتم العثور على الطلب."
        );

        return;

    }


    const order =
        orders[index];


    const oldStatus =
        normalizeStatus(
            order.status
        );


    if(
        oldStatus ===
        normalized
    ){

        return;

    }


    const oldStatusValue =
        order.status;


    order.status =
        normalized;


    order.updatedAt =
        new Date().toISOString();


    /*
       نحفظ محليًا أولًا
       حتى لا تضيع الحالة
    */

    saveLocalOrders(
        orders
    );


    /*
       إذا كان الطلب من Firestore
       نحدثه هناك أيضًا
    */

    if(db){

        try{

            await db
                .collection("orders")
                .doc(
                    String(orderId)
                )
                .update({

                    status:
                        normalized,

                    updatedAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                });


        }catch(error){

            console.error(
                "Update order error:",
                error
            );

            /*
               نرجع الحالة القديمة
               إذا فشل Firestore
            */

            order.status =
                oldStatusValue;

            saveLocalOrders(
                orders
            );


            alert(
                "تعذر تحديث الطلب في Firestore."
            );

            return;

        }

    }


    /*
       إشعار العميل
    */

    await createOrderNotification(
        order,
        normalized
    );


    renderOrders();

    updateOrderStats();


    alert(
        "تم تغيير حالة الطلب وإرسال الإشعار 🔔"
    );

}


/* =====================================================
   CREATE NOTIFICATION
===================================================== */

async function createOrderNotification(
    order,
    newStatus
){

    if(!db){

        console.warn(
            "Firestore غير متاح."
        );

        return false;

    }


    const userId =
        String(
            order.userId || ""
        ).trim();


    if(!userId){

        console.warn(
            "الطلب لا يحتوي userId."
        );

        return false;

    }


    const orderNumber =
        order.orderNumber ||
        order.id ||
        order.orderId ||
        "طلبك";


    const statusText =
        getStatusText(
            newStatus
        );


    try{

        await db
            .collection("notifications")
            .add({

                userId:
                    userId,

                orderId:
                    String(
                        order.id || ""
                    ),

                orderNumber:
                    String(
                        orderNumber
                    ),

                type:
                    "order_status",

                status:
                    normalizeStatus(
                        newStatus
                    ),

                title:
                    "تحديث حالة الطلب 🔔",

                message:
                    `تم تحديث حالة طلبك ${orderNumber} إلى: ${statusText}`,

                read:
                    false,

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        return true;

    }catch(error){

        console.error(
            "Notification error:",
            error
        );

        return false;

    }

}


/* =====================================================
   DELETE ORDER
===================================================== */

async function deleteOrder(
    orderId
){

    const confirmed =
        confirm(
            "هل تريد حذف هذا الطلب نهائيًا؟"
        );


    if(!confirmed){
        return;
    }


    const orders =
        getOrders();


    const filtered =
        orders.filter(
            order =>
                String(order.id)
                !==
                String(orderId)
        );


    saveLocalOrders(
        filtered
    );


    if(db){

        try{

            await db
                .collection("orders")
                .doc(
                    String(orderId)
                )
                .delete();

        }catch(error){

            console.error(
                "Delete Firestore order error:",
                error
            );

            alert(
                "تم الحذف محليًا لكن تعذر حذفه من Firestore."
            );

        }

    }


    renderOrders();

    updateOrderStats();

}


/* =====================================================
   ORDER STATS
===================================================== */

function updateOrderStats(){

    const orders =
        getOrders();


    const newOrders =
        orders.filter(
            order =>
                normalizeStatus(
                    order.status
                )
                ===
                "pending"
        ).length;


    const sales =
        orders.reduce(
            (sum,order) => {

                const status =
                    normalizeStatus(
                        order.status
                    );


                if(
                    status === "cancelled"
                ){

                    return sum;

                }


                return (
                    sum +
                    Number(
                        order.total || 0
                    )
                );

            },
            0
        );


    const newOrdersElement =
        document.getElementById(
            "newOrders"
        );


    const salesElement =
        document.getElementById(
            "salesValue"
        );


    if(newOrdersElement){

        newOrdersElement.textContent =
            newOrders;

    }


    if(salesElement){

        salesElement.textContent =
            formatPrice(sales)
            +
            " د.ل";

    }

}


function updateStats(){

    const products =
        getProducts();


    updateProductStats(
        products
    );


    updateOrderStats();

}


/* =====================================================
   MIGRATE LOCAL ORDERS
===================================================== */

async function migrateLocalOrders(){

    if(!db){
        return;
    }


    const localOrders =
        getLocalOrders();


    if(!localOrders.length){
        return;
    }


    try{

        for(
            const order
            of localOrders
        ){

            const id =
                String(
                    order.id ||
                    order.orderNumber ||
                    ""
                ).trim();


            if(!id){
                continue;
            }


            const ref =
                db
                    .collection("orders")
                    .doc(id);


            const existing =
                await ref.get();


            if(!existing.exists){

                await ref.set(
                    order,
                    {
                        merge:true
                    }
                );

            }

        }

    }catch(error){

        console.error(
            "Migration error:",
            error
        );

    }

}

                    ===
                    "productModal"
                ){

                }

            }
        );

}
