/* ================= DASHBOARD ================= */

.sidebar{

.brand{

.main{

.admin-name{

.content{

/* ================= STATS ================= */

.stats{

}

.stat-card{

    border:1px solid #e8eaee;
}

.stat-top{

    justify-content:space-between;
    margin-bottom:18px;
}

.stat-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    justify-content:center;

}

.stat-title{

}

.stat-number{

/* ================= SECTIONS ================= */

.admin-section{

.admin-section.active-section{

/* ================= PRODUCTS ================= */

.products-box,

}

}

.products-header h2,

    font-weight:bold;

}

.search-box{

    padding:14px;

    border-radius:12px;

    font-size:15px;
    margin-bottom:22px;

/* ================= PRODUCT GRID ================= */

.product-details{

.order-total{

.order-controls{

.empty{

.form-group textarea{

}

.form-row{

    grid-template-columns:1fr 1fr;
    gap:12px;
}

.image-preview{
    display:none;
    width:140px;
    height:140px;
    margin-top:10px;
    border-radius:12px;
    overflow:hidden;
    background:#eee;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.form-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.form-actions button{
    padding:13px;
    border:0;

    font-weight:bold;
    cursor:pointer;
}

.cancel{
    background:#e5e7eb;
}

.save{

    color:white;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .stats{

    .products-grid{

    .products-header,

    .add-product{

    }

    .order-controls{
        flex-direction:column;
    }

    .status-select,
    .delete-order{
        width:100%;
    }
}

@media(max-width:450px){

    .stats{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        padding:18px;
    }
}

const STORAGE_KEY =
    "myStoreProducts";

const ORDERS_KEY =
    "myStoreOrders";

const PASSWORD =
    "1234";

let products = [];

let editingId = null;

let selectedImage = "";


// ========================================
// LOGIN
// ========================================

function login(){

    const password =
        document.getElementById(
            "password"
        ).value;


    if(password === PASSWORD){

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        showDashboard();

    }else{

        document.getElementById(
            "loginError"
        ).style.display =
            "block";

    }

}


function showDashboard(){

    document.getElementById(
        "loginPage"
    ).style.display =
        "none";

    document.getElementById(
        "dashboard"
    ).style.display =
        "block";

    loadProducts();

    updateOrderStats();

}


function logout(){

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    location.reload();

}


function goToStore(){

    window.location.href =
        "index.html";

}


// ========================================
// الأقسام
// ========================================

function showProducts(){

    document.getElementById(
        "productsSection"
    ).classList.add(
        "active-section"
    );

    document.getElementById(
        "ordersSection"
    ).classList.remove(
        "active-section"
    );


    document.getElementById(
        "productsMenu"
    ).classList.add(
        "active"
    );

    document.getElementById(
        "ordersMenu"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "pageTitle"
    ).textContent =
        "إدارة المنتجات";


    loadProducts();

}


function showOrders(){

    document.getElementById(
        "productsSection"
    ).classList.remove(
        "active-section"
    );

    document.getElementById(
        "ordersSection"
    ).classList.add(
        "active-section"
    );


    document.getElementById(
        "productsMenu"
    ).classList.remove(
        "active"
    );

        "active"
    );


    document.getElementById(
        "pageTitle"
    ).textContent =
        "طلبات العملاء";

}


// ========================================
// PRODUCTS
// ========================================

function loadProducts(){

    try{

        products =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                )
            ) || [];

    }catch(e){

        products = [];

    }

    renderProducts();

}


function saveProducts(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(products)
    );

}

        document.getElementById(
            "productsGrid"

    }

            "searchProducts"

// ========================================
// STATS
// ========================================

function updateStats(){

    const total =
        products.length;


    const available =
        products.filter(
            p =>
                Number(p.quantity) > 0
        ).length;


    document.getElementById(
        "totalProducts"
    ).textContent =
        total;


    document.getElementById(
        "availableProducts"
    ).textContent =
        available;


    updateOrderStats();

}


function updateOrderStats(){

    const orders =
        getOrders();


    const newOrders =
        orders.filter(
            order =>
                normalizeStatus(order.status) ===
                "جديد"
        ).length;


    const sales =
        orders.reduce(
            (sum, order) =>
                sum +
                Number(
                    order.total || 0
                ),
            0
        );


    const newElement =
        document.getElementById(
            "newOrders"
        );


    const salesElement =
        document.getElementById(
            "salesValue"
        );


    if(newElement){

        newElement.textContent =
            newOrders;

    }


    if(salesElement){

        salesElement.textContent =
            sales.toFixed(2) +
            " د.ل";

    }


    const badge =
        document.getElementById(
            "ordersBadge"
        );


    if(badge){

        badge.textContent =
            newOrders > 0
            ? "(" + newOrders + ")"
            : "";

    }

}


// ========================================
// ORDERS
// ========================================

function getOrders(){

    try{

        const data =
            localStorage.getItem(
                ORDERS_KEY
            );


        if(!data){

            return [];

        }


        const parsed =
            JSON.parse(data);


        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        return [];

    }

}


function saveOrders(orders){

    localStorage.setItem(
        ORDERS_KEY,
        JSON.stringify(orders)
    );

}


// ========================================
// توحيد الحالات القديمة والجديدة
// ========================================

function normalizeStatus(status){

    const value =
        String(status || "جديد").trim();


    if(value === "جديد"){
        return "جديد";
    }


    if(
        value === "مؤكد" ||
        value === "تم التأكيد"
    ){
        return "تم التأكيد";
    }


    if(
        value === "قيد التجهيز" ||
        value === "جاري التجهيز"
    ){
        return "قيد التجهيز";
    }


    if(
        value === "جاهز"
    ){
        return "جاهز";
    }


    if(
        value === "في الشحن" ||
        value === "شحن"
    ){
        return "في الشحن";
    }


    if(
        value === "تم التسليم" ||
        value === "مكتمل"
    ){
        return "تم التسليم";
    }


    if(
        value === "ملغي" ||
        value === "ملغى"
    ){
        return "ملغي";
    }


    return value;

}


// ========================================
// اسم العميل والهاتف
// يدعم الطلبات القديمة والجديدة
// ========================================

function getCustomerName(order){

    return (
        order.customerName ||
        order.name ||
        "-"
    );

}


function getCustomerPhone(order){

    return (
        order.customerPhone ||
        order.phone ||
        "-"
    );

}


// ========================================
// عرض الطلبات
// ========================================

function renderOrders(){

    const container =
        document.getElementById(
            "ordersList"
        );


    if(!container){

        return;

    }


    const searchInput =
        document.getElementById(
            "searchOrders"
        );


    const search =
        searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    const orders =
        getOrders();


    const filtered =
        orders.filter(
            order => {

                const text =
                    (
                        String(
                            order.id || ""
                        ) +

                        " " +

                        String(
                            getCustomerName(order)
                        ) +

                        " " +

                        String(
                            getCustomerPhone(order)
                        ) +

                        " " +

                        String(
                            order.city || ""
                        ) +

                        " " +

                        String(
                            order.address || ""
                        )
                    )
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                🛒 لا توجد طلبات حالياً

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(
            order =>
                createOrderCard(
                    order
                )
        ).join("");

}


// ========================================
// أيقونة حالة الطلب
// ========================================

function getStatusIcon(status){

    const normalized =
        normalizeStatus(status);


    if(normalized === "جديد"){
        return "🆕";
    }


    if(normalized === "تم التأكيد"){
        return "👍";
    }


    if(normalized === "قيد التجهيز"){
        return "🔧";
    }


    if(normalized === "جاهز"){
        return "📦";
    }


    if(normalized === "في الشحن"){
        return "🚚";
    }


    if(normalized === "تم التسليم"){
        return "✅";
    }


    if(normalized === "ملغي"){
        return "❌";
    }


    return "📌";

}


// ========================================
// بطاقة الطلب
// ========================================

function createOrderCard(order){

    const items =
        Array.isArray(order.items)
        ? order.items
        : [];


    const date =
        order.dateText ||
        (
            order.date
            ? new Date(
                order.date
            ).toLocaleString(
                "ar-LY"
            )
            : "-"
        );


    const status =
        normalizeStatus(
            order.status
        );


    const customerName =
        getCustomerName(
            order
        );


    const customerPhone =
        getCustomerPhone(
            order
        );


    return `

        <div class="order-card">


            <div class="order-top">

                <div>

                    <div class="order-number">

                        🔢 ${escapeHTML(
                            order.id || "-"
                        )}

                    </div>

                </div>


                <div>

                    <div class="order-date">

                        🕐 ${escapeHTML(
                            date
                        )}

                    </div>

                    <div class="order-status-badge">

                        ${getStatusIcon(status)}

                        ${escapeHTML(status)}

                    </div>

                </div>

            </div>


            <div class="order-customer">

                <strong>
                    👤 العميل:
                </strong>

                ${escapeHTML(
                    customerName
                )}

                <br>


                <strong>
                    📱 الهاتف:
                </strong>

                ${escapeHTML(
                    customerPhone
                )}

                <br>


                <strong>
                    📍 المدينة:
                </strong>

                ${escapeHTML(
                    order.city || "-"
                )}

                <br>


                <strong>
                    🏠 العنوان:
                </strong>

                ${escapeHTML(
                    order.address || "-"
                )}


                ${
                    order.notes

                    ?

                    `
                    <br>

                    <strong>
                        📝 ملاحظات:
                    </strong>

                    ${escapeHTML(
                        order.notes
                    )}
                    `

                    :

                    ""
                }

            </div>


            <div class="order-items">

                ${
                    items.length

                    ?

                    items.map(
                        item => `

                        <div class="order-item">

                            <span>

                                ${escapeHTML(
                                    item.name || "-"
                                )}

                                ×

                                ${Number(
                                    item.quantity || 0
                                )}

                                <br>

                                <small>

                                    ${
                                        item.size
                                        ?
                                        "المقاس: " +
                                        escapeHTML(item.size)
                                        :
                                        ""
                                    }

                                    ${
                                        item.color
                                        ?
                                        (
                                            item.size
                                            ? " | "
                                            : ""
                                        ) +
                                        "اللون: " +
                                        escapeHTML(item.color)
                                        :
                                        ""
                                    }

                                </small>

                            </span>


                            <strong>

                                ${(
                                    Number(
                                        item.price || 0
                                    ) *

                                    Number(
                                        item.quantity || 0
                                    )
                                ).toFixed(2)}

                                د.ل

                            </strong>

                        </div>

                    `
                    ).join("")

                    :

                    `
                    <div class="empty">
                        لا توجد منتجات
                    </div>
                    `
                }

            </div>


            <div class="order-total">

                💰 الإجمالي:

                ${Number(
                    order.total || 0
                ).toFixed(2)}

                د.ل

            </div>


            <div class="order-controls">


                <select
                    class="status-select"
                    onchange="
                        changeOrderStatus(
                            '${escapeJS(order.id || "")}',
                            this.value
                        )
                    "
                >

                    <option
                        value="جديد"
                        ${
                            status ===
                            "جديد"
                            ? "selected"
                            : ""
                        }
                    >
                        🆕 جديد
                    </option>


                    <option
                        value="تم التأكيد"
                        ${
                            status ===
                            "تم التأكيد"
                            ? "selected"
                            : ""
                        }
                    >
                        👍 تم التأكيد
                    </option>


                    <option
                        value="قيد التجهيز"
                        ${
                            status ===
                            "قيد التجهيز"
                            ? "selected"
                            : ""
                        }
                    >
                        🔧 قيد التجهيز
                    </option>


                    <option
                        value="جاهز"
                        ${
                            status ===
                            "جاهز"
                            ? "selected"
                            : ""
                        }
                    >
                        📦 جاهز
                    </option>


                    <option
                        value="في الشحن"
                        ${
                            status ===
                            "في الشحن"
                            ? "selected"
                            : ""
                        }
                    >
                        🚚 في الشحن
                    </option>


                    <option
                        value="تم التسليم"
                        ${
                            status ===
                            "تم التسليم"
                            ? "selected"
                            : ""
                        }
                    >
                        ✅ تم التسليم
                    </option>


                    <option
                        value="ملغي"
                        ${
                            status ===
                            "ملغي"
                            ? "selected"
                            : ""

}


// ========================================
// تغيير حالة الطلب
// ========================================

function changeOrderStatus(
    orderId,
    status
){

    const orders =
        getOrders();


    const index =
        orders.findIndex(
            order =>
                String(order.id) ===
                String(orderId)
        );


    if(index === -1){

        alert(
            "لم يتم العثور على الطلب."
        );

        return;

    }


    orders[index].status =
        normalizeStatus(status);


    saveOrders(
        orders
    );


    renderOrders();

    updateOrderStats();


    alert(
        "تم تحديث حالة الطلب إلى: " +
        orders[index].status +
        " ✅"
    );

}


// ========================================
// حذف الطلب
// ========================================

function deleteOrder(orderId){

    const orders =
        getOrders();


    const order =
        orders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if(!order){

        return;

    }


    if(
        !confirm(
            "هل أنت متأكد من حذف الطلب:\n\n" +
            order.id +
            "\n\nلا يمكن التراجع عن هذه العملية."
        )
    ){

        return;

    }


    const filtered =
        orders.filter(
            item =>
                String(item.id) !==
                String(orderId)
        );


    saveOrders(
        filtered
    );


    renderOrders();

    updateOrderStats();


    alert(
        "تم حذف الطلب ✅"
    );

}

// ADD PRODUCT

function openProductModal(){

    editingId = null;

    selectedImage = "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        "➕ إضافة منتج جديد";


    document.getElementById(
        "productForm"
    ).reset();


    document.getElementById(
        "productId"
    ).value =
        "";


    document.getElementById(
        "imagePreview"
    ).style.display =
        "none";


    document.getElementById(
        "productModal"
    ).classList.add(
        "show"
    );

}


// ========================================
// CLOSE MODAL
// ========================================

function closeProductModal(){

    document.getElementById(
        "productModal"
    ).classList.remove(
        "show"
    );

}


// ========================================
// EDIT PRODUCT
// ========================================

function editProduct(id){

    const product =
        products.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if(!product){

        return;

    }


    editingId =
        id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "✏️ تعديل المنتج";


    document.getElementById(
        "productId"
    ).value =
        product.id;


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || 0;


    document.getElementById(
        "productQuantity"
    ).value =
        product.quantity || 0;


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "productSizes"
    ).value =
        Array.isArray(
            product.sizes
        )
        ? product.sizes.join(", ")
        : product.sizes || "";


    document.getElementById(
        "productColors"
    ).value =
        Array.isArray(
            product.colors
        )
        ? product.colors.join(", ")
        : product.colors || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    selectedImage =
        product.image || "";


    if(product.image){

        document.getElementById(
            "previewImg"
        ).src =
            product.image;


        document.getElementById(
            "imagePreview"
        ).style.display =
            "block";

    }else{

        document.getElementById(
            "imagePreview"
        ).style.display =
            "none";

    }


    document.getElementById(
        "productModal"
    ).classList.add(
        "show"
    );

}


// ========================================
// IMAGE
// ========================================

document.getElementById(
    "productImage"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                selectedImage =
                    e.target.result;


                document.getElementById(
                    "previewImg"
                ).src =
                    selectedImage;


                document.getElementById(
                    "imagePreview"
                ).style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


// ========================================
// SAVE PRODUCT
// ========================================

document.getElementById(
    "productForm"
).addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const price =
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            );


        const quantity =
            Number(
                document.getElementById(
                    "productQuantity"
                ).value
            );


        const category =
            document.getElementById(
                "productCategory"
            ).value;


        const sizes =
            document.getElementById(
                "productSizes"
            ).value
            .split(",")
            .map(
                x => x.trim()
            )
            .filter(Boolean);


        const colors =
            document.getElementById(
                "productColors"
            ).value
            .split(",")
            .map(
                x => x.trim()
            )
            .filter(Boolean);


        const description =
            document.getElementById(
                "productDescription"
            ).value.trim();


        if(!name){

            alert(
                "اكتب اسم المنتج"
            );

            return;

        }


        if(
            price < 0 ||
            quantity < 0
        ){

            alert(
                "السعر والكمية يجب ألا تكون سالبة"
            );

            return;

        }


        if(editingId){

            const index =
                products.findIndex(
                    p =>
                        String(p.id) ===
                        String(editingId)
                );


            if(index !== -1){

                products[index] = {

                    ...products[index],

                    name,

                    price,

                    quantity,

                    category,

                    sizes,

                    colors,

                    description,

                    image:
                        selectedImage

                };

            }

        }else{

            products.unshift({

                id:
                    Date.now().toString(),

                name,

                price,

                quantity,

                category,

                sizes,

                colors,

                description,

                image:
                    selectedImage

            });

        }


        saveProducts();

        closeProductModal();

        loadProducts();


        alert(
            editingId
            ? "تم تعديل المنتج بنجاح ✅"
            : "تمت إضافة المنتج بنجاح ✅"
        );

    }
);


// ========================================
// DELETE PRODUCT
// ========================================

function deleteProduct(id){

    const product =
        products.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if(!product){

        return;

    }


    if(
        !confirm(
            "هل أنت متأكد من حذف:\n\n" +
            product.name +
            "\n\nلا يمكن التراجع عن هذه العملية."
        )
    ){

        return;

    }


    products =
        products.filter(
            p =>
                String(p.id) !==
                String(id)
        );


    saveProducts();

    loadProducts();


    alert(
        "تم حذف المنتج ✅"
    );

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(text){

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ========================================
// حماية النص عند وضعه داخل onclick
// ========================================

function escapeJS(text){

    return String(text || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}
