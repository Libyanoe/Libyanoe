<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة المتجر</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7fa;
    color:#18202a;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#111827,#1f2937);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    text-align:center;
}

.login-box h1{
    margin-bottom:10px;
}

.login-box p{
    color:#6b7280;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:12px;
    font-size:16px;
    text-align:center;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.login-error{
    color:#dc2626;
    margin-top:12px;
    display:none;
}


/* =========================
   DASHBOARD
========================= */

.dashboard{
    min-height:100vh;
    display:flex;
}


/* SIDEBAR */

.sidebar{
    width:250px;
    background:#111827;
    color:white;
    min-height:100vh;
    padding:20px;
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
    text-align:center;
    padding:15px 5px 25px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    width:100%;
    border:none;
    background:transparent;
    color:#d1d5db;
    padding:13px;
    border-radius:10px;
    text-align:right;
    font-size:15px;
}

.menu button:hover,
.menu button.active{
    background:#374151;
    color:white;
}

.menu .add-btn{
    background:#2563eb;
    color:white;
    margin-top:10px;
}

.menu .store-btn{
    margin-top:10px;
    background:#059669;
    color:white;
}

.menu .logout-btn{
    margin-top:10px;
    background:#dc2626;
    color:white;
}


/* MAIN */

.main{
    flex:1;
    margin-right:250px;
    padding:25px;
}

.topbar{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.topbar h1{
    font-size:24px;
}

.firebase-status{
    font-size:13px;
    color:#059669;
    background:#ecfdf5;
    padding:7px 12px;
    border-radius:20px;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat-card .icon{
    font-size:28px;
    margin-bottom:8px;
}

.stat-card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:7px;
}

.stat-card strong{
    font-size:25px;
}


/* =========================
   SECTIONS
========================= */

.section{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.section-header h2{
    font-size:20px;
}

.search-box{
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    min-width:250px;
    outline:none;
}

.search-box:focus{
    border-color:#2563eb;
}


/* =========================
   PRODUCTS
========================= */

.products-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
}

.product-card{
    border:1px solid #e5e7eb;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product-image{
    height:200px;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-content{
    padding:15px;
}

.product-content h3{
    margin-bottom:8px;
}

.product-price{
    font-weight:bold;
    font-size:18px;
    margin-bottom:6px;
}

.product-stock{
    color:#6b7280;
    font-size:14px;
    margin-bottom:10px;
}

.product-category{
    display:inline-block;
    background:#eef2ff;
    color:#3730a3;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    margin-bottom:10px;
}

.product-actions{
    display:flex;
    gap:8px;
}

.product-actions button{
    flex:1;
    border:none;
    border-radius:9px;
    padding:10px;
    font-weight:bold;
}

.edit-btn{
    background:#e0f2fe;
    color:#0369a1;
}

.delete-btn{
    background:#fee2e2;
    color:#b91c1c;
}


/* =========================
   ORDERS
========================= */

.orders-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.order-card{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:18px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.order-number{
    font-weight:bold;
    font-size:18px;
}

.order-date{
    color:#6b7280;
    font-size:13px;
    margin-top:5px;
}

.order-customer{
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
    line-height:1.8;
}

.order-items{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

.order-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    background:#f9fafb;
    border-radius:10px;
}

.order-item img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}

.order-item-info{
    flex:1;
}

.order-item-info strong{
    display:block;
    margin-bottom:3px;
}

.order-item-info small{
    color:#6b7280;
}

.order-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-top:1px solid #eee;
    padding-top:15px;
    flex-wrap:wrap;
}

.order-total{
    font-size:18px;
    font-weight:bold;
}

.status-select{
    padding:10px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    min-width:150px;
}

.delete-order{
    border:none;
    background:#fee2e2;
    color:#b91c1c;
    padding:10px 13px;
    border-radius:9px;
    font-weight:bold;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close-modal{
    border:none;
    background:#f3f4f6;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.preview{
    margin-top:10px;
    width:120px;
    height:120px;
    border-radius:10px;
    overflow:hidden;
    background:#f3f4f6;
    display:none;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.save-product{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}


/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:40px 20px;
    color:#6b7280;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .sidebar{
        width:210px;
    }

    .main{
        margin-right:210px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .dashboard{
        display:block;
    }

    .sidebar{
        position:relative;
        width:100%;
        min-height:auto;
    }

    .main{
        margin-right:0;
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .search-box{
        min-width:100%;
    }

    .form-row{
        grid-template-columns:1fr;
    }

}

@media(max-width:450px){

    .stats{
        grid-template-columns:1fr;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .order-footer{
        align-items:stretch;
        flex-direction:column;
    }

    .status-select{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <h1>🔐 لوحة الإدارة</h1>

        <p>
            سجّل الدخول لإدارة المتجر
        </p>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            دخول
        </button>

        <div
            id="loginError"
            class="login-error"
        >
            كلمة المرور غير صحيحة
        </div>

    </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div
    id="dashboard"
    class="dashboard hidden"
>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            🏪 متجر الرياضة
        </div>

        <div class="menu">

            <button
                id="productsMenu"
                class="active"
                onclick="showProducts()"
            >
                📦 المنتجات
            </button>

            <button
                id="ordersMenu"
                onclick="showOrders()"
            >
                🛒 الطلبات
            </button>

            <button
                class="add-btn"
                onclick="openProductModal()"
            >
                ➕ إضافة منتج
            </button>

            <button
                class="store-btn"
                onclick="goToStore()"
            >
                🏪 المتجر
            </button>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                🚪 تسجيل الخروج
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="topbar">

            <h1 id="pageTitle">
                إدارة المنتجات
            </h1>

            <div
                id="firebaseStatus"
                class="firebase-status"
            >
                🔄 الاتصال بـ Firestore...
            </div>

        </div>


        <!-- =========================
             STATS
        ========================= -->

        <div class="stats">

            <div class="stat-card">

                <div class="icon">
                    📦
                </div>

                <h3>
                    إجمالي المنتجات
                </h3>

                <strong id="totalProducts">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="icon">
                    ✅
                </div>

                <h3>
                    المنتجات المتوفرة
                </h3>

                <strong id="availableProducts">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="icon">
                    🛒
                </div>

                <h3>
                    الطلبات الجديدة
                </h3>

                <strong id="newOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="icon">
                    💰
                </div>

                <h3>
                    قيمة المبيعات
                </h3>

                <strong id="salesValue">
                    0 د.ل
                </strong>

            </div>

        </div>


        <!-- =========================
             PRODUCTS
        ========================= -->

        <section
            id="productsSection"
            class="section"
        >

            <div class="section-header">

                <h2>
                    📦 المنتجات
                </h2>

                <input
                    type="search"
                    id="searchProducts"
                    class="search-box"
                    placeholder="🔎 البحث عن منتج..."
                    oninput="renderProducts()"
                >

            </div>

            <div
                id="productsGrid"
                class="products-grid"
            ></div>

        </section>


        <!-- =========================
             ORDERS
        ========================= -->

        <section
            id="ordersSection"
            class="section hidden"
        >

            <div class="section-header">

                <h2>
                    🛒 الطلبات
                </h2>

                <input
                    type="search"
                    id="searchOrders"
                    class="search-box"
                    placeholder="🔎 البحث في الطلبات..."
                    oninput="renderOrders()"
                >

            </div>

            <div
                id="ordersList"
                class="orders-list"
            ></div>

        </section>

    </main>

</div>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    id="productModal"
    class="modal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                إضافة منتج
            </h2>

            <button
                class="close-modal"
                onclick="closeProductModal()"
            >
                ×
            </button>

        </div>


        <form id="productForm">


            <input
                type="hidden"
                id="productId"
            >


            <div class="form-group">

                <label>
                    اسم المنتج
                </label>

                <input
                    type="text"
                    id="productName"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        السعر بالدينار
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        الكمية
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    التصنيف
                </label>

                <input
                    type="text"
                    id="productCategory"
                    placeholder="مثال: ملابس"
                >

            </div>


            <div class="form-group">

                <label>
                    المقاسات
                </label>

                <input
                    type="text"
                    id="productSizes"
                    placeholder="S, M, L, XL"
                >

            </div>


            <div class="form-group">

                <label>
                    الألوان
                </label>

                <input
                    type="text"
                    id="productColors"
                    placeholder="أسود, أبيض"
                >

            </div>


            <div class="form-group">

                <label>
                    الوصف
                </label>

                <textarea
                    id="productDescription"
                    placeholder="وصف المنتج..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    صورة المنتج
                </label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/*"
                    onchange="previewImage(event)"
                >

                <div
                    id="imagePreview"
                    class="preview"
                >

                    <img
                        id="previewImg"
                        src=""
                        alt="معاينة"
                    >

                </div>

            </div>


            <button
                type="submit"
                class="save-product"
            >
                💾 حفظ المنتج
            </button>

        </form>

    </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>


<script>


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbdvEYLluTTT7Ti8gikDCBHkf53_07kMs",

    authDomain:
        "suhayeb-25ef9.firebaseapp.com",

    projectId:
        "suhayeb-25ef9",

    storageBucket:
        "suhayeb-25ef9.firebasestorage.app",

    messagingSenderId:
        "904310961712",

    appId:
        "1:904310961712:web:178e457e45db1136d85ff5",

    measurementId:
        "G-KXMD8DQS2X"

};


let db = null;


try{

    firebase.initializeApp(
        firebaseConfig
    );

    db =
        firebase.firestore();

    console.log(
        "Firebase Firestore connected."
    );

    setFirebaseStatus(
        "🟢 Firestore متصل"
    );

}catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

    setFirebaseStatus(
        "🟠 وضع التخزين المحلي"
    );

}


/* =====================================================
   SETTINGS
===================================================== */

const STORAGE_KEY =
    "myStoreProducts";

const ORDERS_KEY =
    "myStoreOrders";

const PASSWORD =
    "1234";


/* =====================================================
   FIRESTORE VARIABLES
===================================================== */

let firestoreOrders = [];

let firestoreOrdersLoaded =
    false;

let ordersUnsubscribe =
    null;

let migrationStarted =
    false;


/* =====================================================
   FIREBASE STATUS
===================================================== */

function setFirebaseStatus(text){

    const element =
        document.getElementById(
            "firebaseStatus"
        );

    if(element){

        element.textContent =
            text;

    }

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const password =
        document
            .getElementById("password")
            .value
            .trim();

    const error =
        document
            .getElementById("loginError");


    if(password === PASSWORD){

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        error.style.display =
            "none";

        showDashboard();

    }else{

        error.style.display =
            "block";

    }

}


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                login();

            }

        }
    );


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(){

    document
        .getElementById("loginPage")
        .classList
        .add("hidden");


    document
        .getElementById("dashboard")
        .classList
        .remove("hidden");


    loadProducts();

    renderProducts();

    updateStats();

    startOrdersListener();

}


/* =====================================================
   AUTO LOGIN
===================================================== */

if(
    sessionStorage.getItem(
        "adminLoggedIn"
    ) === "true"
){

    showDashboard();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    if(ordersUnsubscribe){

        ordersUnsubscribe();

        ordersUnsubscribe =
            null;

    }

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    location.reload();

}


/* =====================================================
   NAVIGATION
===================================================== */

function showProducts(){

    document
        .getElementById(
            "productsSection"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "ordersSection"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "productsMenu"
        )
        .classList
        .add("active");


    document
        .getElementById(
            "ordersMenu"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "pageTitle"
        )
        .textContent =
        "إدارة المنتجات";

}


function showOrders(){

    document
        .getElementById(
            "productsSection"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "ordersSection"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "productsMenu"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "ordersMenu"
        )
        .classList
        .add("active");


    document
        .getElementById(
            "pageTitle"
        )
        .textContent =
        "إدارة الطلبات";


    renderOrders();

}


/* =====================================================
   STORE
===================================================== */

function goToStore(){

    window.location.href =
        "index.html";

}


/* =====================================================
   PRODUCTS STORAGE
===================================================== */

function getProducts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];

    }catch(error){

        console.error(error);

        return [];

    }

}


function saveProducts(products){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(products)
    );

}


function loadProducts(){

    const products =
        getProducts();

    updateProductStats(
        products
    );

}


/* =====================================================
   PRODUCT STATS
===================================================== */

function updateProductStats(
    products
){

    document
        .getElementById(
            "totalProducts"
        )
        .textContent =
        products.length;


    document
        .getElementById(
            "availableProducts"
        )
        .textContent =
        products.filter(
            p =>
                Number(
                    p.quantity || 0
                ) > 0
        ).length;

}


function updateStats(){

    const products =
        getProducts();

    updateProductStats(
        products
    );

    updateOrderStats();

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );

    if(!grid){
        return;
    }


    const searchInput =
        document.getElementById(
            "searchProducts"
        );


    const search =
        searchInput
        ?
        searchInput
            .value
            .trim()
            .toLowerCase()
        :
        "";


    const products =
        getProducts();


    const filtered =
        products.filter(
            product => {

                const name =
                    String(
                        product.name || ""
                    )
                    .toLowerCase();


                const category =
                    String(
                        product.category || ""
                    )
                    .toLowerCase();


                return (
                    name.includes(search)
                    ||
                    category.includes(search)
                );

            }
        );


    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty">
                📦 لا توجد منتجات
            </div>
        `;

        return;

    }


    grid.innerHTML =
        filtered
            .map(
                product =>
                    createProductCard(
                        product
                    )
            )
            .join("");

}


/* =====================================================
   PRODUCT CARD
===================================================== */

function createProductCard(
    product
){

    const image =
        product.image || "";

    const quantity =
        Number(
            product.quantity || 0
        );

    const price =
        Number(
            product.price || 0
        );


    return `

        <div class="product-card">

            <div class="product-image">

                ${
                    image
                    ?
                    `
                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(
                            product.name || ""
                        )}"
                    >
                    `
                    :
                    `
                    <span style="font-size:50px">
                        🏃
                    </span>
                    `
                }

            </div>


            <div class="product-content">

                ${
                    product.category
                    ?
                    `
                    <span class="product-category">
                        ${escapeHTML(
                            product.category
                        )}
                    </span>
                    `
                    :
                    ""
                }


                <h3>
                    ${escapeHTML(
                        product.name
                        ||
                        "منتج"
                    )}
                </h3>


                <div class="product-price">
                    ${
                        formatPrice(price)
                    }
                    د.ل
                </div>


                <div class="product-stock">
                    الكمية:
                    ${quantity}
                </div>


                ${
                    product.description
                    ?
                    `
                    <p
                        style="
                            color:#6b7280;
                            font-size:13px;
                            margin-bottom:10px;
                        "
                    >
                        ${escapeHTML(
                            product.description
                        )}
                    </p>
                    `
                    :
                    ""
                }


                <div class="product-actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct(
                            '${escapeJS(product.id)}'
                        )"
                    >
                        ✏️ تعديل
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteProduct(
                            '${escapeJS(product.id)}'
                        )"
                    >
                        🗑️ حذف
                    </button>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   PRODUCT MODAL
===================================================== */

function openProductModal(
    product
){

    const modal =
        document.getElementById(
            "productModal"
        );


    const form =
        document.getElementById(
            "productForm"
        );


    form.reset();


    document
        .getElementById(
            "productId"
        )
        .value = "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "إضافة منتج";


    document
        .getElementById(
            "imagePreview"
        )
        .style
        .display =
        "none";


    document
        .getElementById(
            "previewImg"
        )
        .src = "";


    if(product){

        document
            .getElementById(
                "productId"
            )
            .value =
            product.id || "";


        document
            .getElementById(
                "productName"
            )
            .value =
            product.name || "";


        document
            .getElementById(
                "productPrice"
            )
            .value =
            product.price || "";


        document
            .getElementById(
                "productQuantity"
            )
            .value =
            product.quantity || "";


        document
            .getElementById(
                "productCategory"
            )
            .value =
            product.category || "";


        document
            .getElementById(
                "productSizes"
            )
            .value =
            Array.isArray(
                product.sizes
            )
            ?
            product.sizes.join(", ")
            :
            product.sizes || "";


        document
            .getElementById(
                "productColors"
            )
            .value =
            Array.isArray(
                product.colors
            )
            ?
            product.colors.join(", ")
            :
            product.colors || "";


        document
            .getElementById(
                "productDescription"
            )
            .value =
            product.description || "";


        if(product.image){

            document
                .getElementById(
                    "previewImg"
                )
                .src =
                product.image;


            document
                .getElementById(
                    "imagePreview"
                )
                .style
                .display =
                "block";

        }


        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
            "تعديل المنتج";

    }


    modal
        .classList
        .add("show");

}


function closeProductModal(){

    document
        .getElementById(
            "productModal"
        )
        .classList
        .remove("show");

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            document
                .getElementById(
                    "previewImg"
                )
                .src =
                e.target.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style
                .display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

document
    .getElementById(
        "productForm"
    )
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();


            const id =
                document
                    .getElementById(
                        "productId"
                    )
                    .value
                    .trim();


            const name =
                document
                    .getElementById(
                        "productName"
                    )
                    .value
                    .trim();


            const price =
                Number(
                    document
                        .getElementById(
                            "productPrice"
                        )
                        .value
                );


            const quantity =
                Number(
                    document
                        .getElementById(
                            "productQuantity"
                        )
                        .value
                );


            const category =
                document
                    .getElementById(
                        "productCategory"
                    )
                    .value
                    .trim();


            const sizesText =
                document
                    .getElementById(
                        "productSizes"
                    )
                    .value
                    .trim();


            const colorsText =
                document
                    .getElementById(
                        "productColors"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "productDescription"
                    )
                    .value
                    .trim();


            const preview =
                document
                    .getElementById(
                        "previewImg"
                    )
                    .src;


            if(!name){

                alert(
                    "اكتب اسم المنتج."
                );

                return;

            }


            const products =
                getProducts();


            const existingIndex =
                products.findIndex(
                    p =>
                        String(p.id)
                        ===
                        String(id)
                );


            let image = "";


            if(
                preview
                &&
                preview !==
                window.location.href
            ){

                image =
                    preview;

            }


            if(
                existingIndex !== -1
                &&
                !image
            ){

                image =
                    products[
                        existingIndex
                    ].image || "";

            }


            const product = {

                id:
                    id
                    ||
                    generateProductId(),

                name,

                price,

                quantity,

                category,

                sizes:
                    sizesText
                    ?
                    sizesText
                        .split(",")
                        .map(
                            x => x.trim()
                        )
                        .filter(Boolean)
                    :
                    [
                        "S",
                        "M",
                        "L",
                        "XL"
                    ],

                colors:
                    colorsText
                    ?
                    colorsText
                        .split(",")
                        .map(
                            x => x.trim()
                        )
                        .filter(Boolean)
                    :
                    [
                        "أسود",
                        "أبيض"
                    ],

                description,

                image

            };


            if(
                existingIndex !== -1
            ){

                products[
                    existingIndex
                ] = product;

            }else{

                products.push(
                    product
                );

            }


            saveProducts(
                products
            );


            closeProductModal();

            renderProducts();

            updateStats();


            alert(
                existingIndex !== -1
                ?
                "تم تعديل المنتج ✅"
                :
                "تمت إضافة المنتج ✅"
            );

        }
    );


/* =====================================================
   PRODUCT ID
===================================================== */

function generateProductId(){

    return (
        "product_"
        +
        Date.now()
        +
        "_"
        +
        Math.random()
            .toString(36)
            .slice(2,8)
    );

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

    const products =
        getProducts();


    const product =
        products.find(
            p =>
                String(p.id)
                ===
                String(id)
        );


    if(!product){

        alert(
            "لم يتم العثور على المنتج."
        );

        return;

    }


    openProductModal(
        product
    );

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

function deleteProduct(id){

    const products =
        getProducts();


    const product =
        products.find(
            p =>
                String(p.id)
                ===
                String(id)
        );


    if(!product){
        return;
    }


    const confirmed =
        confirm(
            `هل تريد حذف المنتج "${product.name}"؟`
        );


    if(!confirmed){
        return;
    }


    const filtered =
        products.filter(
            p =>
                String(p.id)
                !==
                String(id)
        );


    saveProducts(
        filtered
    );


    renderProducts();

    updateStats();


    alert(
        "تم حذف المنتج 🗑️"
    );

}


/* =====================================================
   FIRESTORE ORDERS LISTENER
===================================================== */

function startOrdersListener(){

    if(!db){

        setFirebaseStatus(
            "🟠 Firestore غير متاح - التخزين المحلي"
        );

        return;

    }


    if(ordersUnsubscribe){

        ordersUnsubscribe();

        ordersUnsubscribe =
            null;

    }


    setFirebaseStatus(
        "🔄 تحميل الطلبات من Firestore..."
    );


    ordersUnsubscribe =
        db
            .collection("orders")
            .onSnapshot(

                snapshot => {


                    firestoreOrders =
                        snapshot.docs
                            .map(
                                doc => {

                                    return {

                                        id:
                                            doc.id,

                                        ...doc.data()

                                    };

                                }
                            );


                    firestoreOrders.sort(
                        (a,b) => {

                            const dateA =
                                getOrderTime(
                                    a.createdAt
                                    ||
                                    a.date
                                );


                            const dateB =
                                getOrderTime(
                                    b.createdAt
                                    ||
                                    b.date
                                );


                            return (
                                dateB
                                -
                                dateA
                            );

                        }
                    );


                    firestoreOrdersLoaded =
                        true;


                    saveLocalOrders(
                        firestoreOrders
                    );


                    setFirebaseStatus(
                        "🟢 Firestore متصل - الطلبات مباشرة"
                    );


                    renderOrders();

                    updateOrderStats();

                },


                error => {

                    console.error(
                        "Firestore listener error:",
                        error
                    );


                    firestoreOrdersLoaded =
                        false;


                    setFirebaseStatus(
                        "🔴 خطأ في Firestore - التخزين المحلي"
                    );


                    renderOrders();

                    updateOrderStats();

                }

            );


    migrateLocalOrdersToFirestore();

}


/* =====================================================
   LOCAL ORDERS
===================================================== */

function getLocalOrders(){

    try{

        return JSON.parse(
            localStorage.getItem(
                ORDERS_KEY
            )
        ) || [];

    }catch(error){

        console.error(error);

        return [];

    }

}


function saveLocalOrders(
    orders
){

    localStorage.setItem(
        ORDERS_KEY,
        JSON.stringify(orders)
    );

}


/* =====================================================
   GET ORDERS
===================================================== */

function getOrders(){

    if(
        firestoreOrdersLoaded
    ){

        return firestoreOrders;

    }

    return getLocalOrders();

}


/* =====================================================
   MIGRATE OLD ORDERS
===================================================== */

async function migrateLocalOrdersToFirestore(){

    if(!db){
        return;
    }


    if(migrationStarted){
        return;
    }


    migrationStarted =
        true;


    const localOrders =
        getLocalOrders();


    if(!localOrders.length){
        return;
    }


    try{

        const snapshot =
            await db
                .collection("orders")
                .limit(1)
                .get();


        if(!snapshot.empty){

            return;

        }


        const batch =
            db.batch();


        let count = 0;


        localOrders.forEach(
            order => {

                const id =
                    String(
                        order.id
                        ||
                        order.orderNumber
                        ||
                        ""
                    ).trim();


                if(!id){
                    return;
                }


                const ref =
                    db
                        .collection("orders")
                        .doc(id);


                batch.set(
                    ref,
                    {

                        ...order,

                        orderNumber:
                            order.orderNumber
                            ||
                            id

                    },
                    {
                        merge:true
                    }
                );


                count++;

            }
        );


        if(count > 0){

            await batch.commit();

            console.log(
                "Old orders migrated:",
                count
            );

        }

    }catch(error){

        console.error(
            "Migration error:",
            error
        );

    }

}


/* =====================================================
   🔔 CREATE NOTIFICATION
===================================================== */

async function createOrderNotification(
    order,
    newStatus
){

    /*
       لا يوجد Firebase
    */

    if(!db){

        console.warn(
            "Firestore غير متاح، لم يتم إنشاء الإشعار."
        );

        return false;

    }


    /*
       نحتاج userId لمعرفة صاحب الطلب
    */

    const userId =
        String(
            order.userId
            ||
            ""
        ).trim();


    if(!userId){

        console.warn(
            "الطلب لا يحتوي userId، لا يمكن إرسال إشعار للعميل.",
            order.id
        );

        return false;

    }


    const orderNumber =
        order.orderNumber
        ||
        order.id
        ||
        order.orderId
        ||
        "طلبك";


    const statusText =
        getNotificationStatusText(
            newStatus
        );


    const message =
        `تم تحديث حالة طلبك ${orderNumber} إلى: ${statusText}`;


    try{

        /*
           ننشئ إشعارًا في:
           
           notifications/{autoId}
        */

        await db
            .collection("notifications")
            .add({

                userId:
                    userId,

                orderId:
                    String(
                        order.id
                    ),

                orderNumber:
                    String(
                        orderNumber
                    ),

                type:
                    "order_status",

                status:
                    newStatus,

                title:
                    "تحديث حالة الطلب 🔔",

                message:
                    message,

                read:
                    false,

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        console.log(
            "Notification created:",
            message
        );


        return true;


    }catch(error){

        console.error(
            "Notification creation error:",
            error
        );


        return false;

    }

}


/* =====================================================

function getNotificationStatusText(
    status
){

    const normalized =
        normalizeStatus(
            status
        );


    const map = {

        pending:
            "⏳ قيد المراجعة",

        confirmed:
            "✅ تم التأكيد",

        preparing:
            "📦 قيد التجهيز",

        ready:
            "🟢 جاهز",

        shipping:
            "🚚 في الشحن",

        delivered:
            "🎉 تم التسليم",

        cancelled:
            "❌ ملغي"

    };


    return (
        map[normalized]
        ||
        "⏳ قيد المراجعة"
    );

}
