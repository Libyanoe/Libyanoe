<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>حسابي - متجر الرياضة</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fa;
    color: #18202a;
    min-height: 100vh;
    line-height: 1.6;
}

.container {
    width: 92%;
    max-width: 1050px;
    margin: auto;
}


/* =========================
   الهيدر
========================= */

.header {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-content {
    min-height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    text-decoration: none;
    color: #111827;
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 45px;
    height: 45px;
    border-radius: 13px;
    background: #111827;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.logo strong {
    display: block;
    font-size: 17px;
}

.logo small {
    display: block;
    color: #6b7280;
    font-size: 10px;
    letter-spacing: 1px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}


/* =========================
   زر الإشعارات
========================= */

.notification-wrapper {
    position: relative;
}

.notification-button {
    position: relative;
    width: 44px;
    height: 44px;
    border: 1px solid #e5e7eb;
    background: #ffffff;
    border-radius: 12px;
    cursor: pointer;
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
}

.notification-button:hover {
    background: #f3f4f6;
}

.notification-badge {
    position: absolute;
    top: -5px;
    left: -5px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    background: #ef4444;
    color: #ffffff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;
}

.notification-badge.show {
    display: flex;
}


/* =========================
   قائمة الإشعارات
========================= */

.notifications-panel {
    position: absolute;
    top: 55px;
    left: 0;
    width: 350px;
    max-width: calc(100vw - 30px);
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 15px 45px rgba(0,0,0,.15);
    overflow: hidden;
    display: none;
    z-index: 500;
}

.notifications-panel.show {
    display: block;
}

.notifications-head {
    padding: 15px;
    border-bottom: 1px solid #eef0f3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.notifications-head strong {
    font-size: 16px;
}

.mark-all-button {
    border: 0;
    background: transparent;
    color: #2563eb;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.notifications-list {
    max-height: 390px;
    overflow-y: auto;
}

.notification-item {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    transition: .2s;
}

.notification-item:hover {
    background: #f8fafc;
}

.notification-item.unread {
    background: #eff6ff;
}

.notification-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #111827;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
}

.notification-content {
    flex: 1;
    min-width: 0;
}

.notification-title {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 3px;
}

.notification-message {
    color: #4b5563;
    font-size: 12px;
    line-height: 1.5;
}

.notification-time {
    color: #9ca3af;
    font-size: 10px;
    margin-top: 5px;
}

.notification-delete {
    border: 0;
    background: transparent;
    color: #9ca3af;
    font-size: 16px;
    cursor: pointer;
    align-self: flex-start;
}

.notification-delete:hover {
    color: #ef4444;
}

.empty-notifications {
    text-align: center;
    padding: 35px 15px;
    color: #6b7280;
    font-size: 13px;
}

.empty-notifications-icon {
    font-size: 35px;
    margin-bottom: 7px;
}


/* =========================
   أزرار الهيدر
========================= */

.back-button,
.logout-button {
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

.back-button {
    text-decoration: none;
    background: #f3f4f6;
    color: #111827;
}

.logout-button {
    border: 0;
    background: #111827;
    color: #ffffff;
    cursor: pointer;
}


/* =========================
   الصفحة
========================= */

.page {
    padding: 35px 0 60px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title span {
    color: #6b7280;
    font-size: 13px;
}

.page-title h1 {
    font-size: 30px;
    margin-top: 5px;
}


/* =========================
   الحساب
========================= */

.account-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
    margin-bottom: 25px;
}

.account-top {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 25px;
}

.profile-image {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #111827;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    overflow: hidden;
    flex-shrink: 0;
}

.profile-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.profile-name {
    font-size: 21px;
    font-weight: bold;
}

.edit-name-button {
    border: 0;
    background: #f3f4f6;
    color: #111827;
    padding: 7px 10px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.profile-provider {
    color: #6b7280;
    font-size: 13px;
    margin-top: 3px;
}

.account-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.info-box {
    background: #f8fafc;
    border: 1px solid #eef0f3;
    border-radius: 12px;
    padding: 15px;
}

.info-box span {
    display: block;
    color: #6b7280;
    font-size: 12px;
}

.info-box strong {
    display: block;
    font-size: 15px;
    word-break: break-word;
}


/* =========================
   الطلبات
========================= */

.orders-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.orders-title h2 {
    font-size: 22px;
}

.orders-count {
    background: #111827;
    color: #ffffff;
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 12px;
}

.orders-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.order-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 18px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
}

.order-number {
    font-weight: bold;
    font-size: 15px;
}

.order-date {
    color: #6b7280;
    font-size: 12px;
    margin-top: 3px;
}

.status {
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pending {
    background: #fff7ed;
    color: #c2410c;
}

.status-confirmed {
    background: #eff6ff;
    color: #1d4ed8;
}

.status-preparing {
    background: #f5f3ff;
    color: #6d28d9;
}

.status-shipping {
    background: #ecfeff;
    color: #0e7490;
}

.status-delivered {
    background: #ecfdf5;
    color: #047857;
}

.status-cancelled {
    background: #fef2f2;
    color: #b91c1c;
}

.status-ready {
    background: #ecfdf5;
    color: #047857;
}

.order-items {
    border-top: 1px solid #eef0f3;
    padding-top: 12px;
}

.order-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f1f5f9;
}

.order-item:last-child {
    border-bottom: 0;
}

.order-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.order-item-image {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    object-fit: cover;
    background: #f3f4f6;
    flex-shrink: 0;
}

.order-item-name {
    font-weight: bold;
    font-size: 14px;
}

.order-item-details {
    color: #6b7280;
    font-size: 12px;
}

.order-item-price {
    font-weight: bold;
    white-space: nowrap;
    font-size: 13px;
}

.order-footer {
    border-top: 1px solid #eef0f3;
    margin-top: 10px;
    padding-top: 14px;
    display: flex;
    justify-content: space-between;
}

.order-total-label {
    color: #6b7280;
    font-size: 13px;
}

.order-total {
    font-size: 18px;
}


/* =========================
   لا توجد طلبات
========================= */

.empty-orders {
    text-align: center;
    padding: 45px 20px;
    background: #ffffff;
    border-radius: 16px;
    border: 1px dashed #d1d5db;
    color: #6b7280;
}

.empty-icon {
    font-size: 42px;
}

.empty-orders strong {
    display: block;
    color: #18202a;
    margin: 5px 0;
}

.shop-button {
    display: inline-block;
    margin-top: 15px;
    background: #111827;
    color: #ffffff;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 10px;
    font-weight: bold;
}


/* =========================
   رسائل
========================= */

.error-box {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
    display: none;
}

.error-box.show {
    display: block;
}


/* =========================
   الفوتر
========================= */

.footer {
    background: #111827;
    color: #ffffff;
    text-align: center;
    padding: 25px 0;
}

.footer-logo {
    font-size: 18px;
    font-weight: bold;
}

.footer p {
    color: #9ca3af;
    font-size: 13px;
}


/* =========================
   الهاتف
========================= */

@media (max-width:700px) {

    .account-info {
        grid-template-columns: 1fr;
    }

    .account-card {
        padding: 18px;
    }

    .order-header {
        flex-direction: column;
    }

    .back-button span {
        display: none;
    }

    .notifications-panel {
        left: -45px;
        width: 330px;
    }

}

@media (max-width:450px) {

    .header-actions {
        gap: 6px;
    }

    .logout-button {
        padding: 9px 10px;
        font-size: 12px;
    }

    .notification-button {
        width: 42px;
        height: 42px;
    }

    .notifications-panel {
        left: -70px;
        width: calc(100vw - 25px);
    }

}

</style>

</head>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut,
    updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    writeBatch
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbdvEYLluTTT7Ti8gikDCBHkf53_07kMs",

    authDomain:
        "suhayeb-25ef9.firebaseapp.com",

    projectId:
        "suhayeb-25ef9",

    storageBucket:
        "suhayeb-25ef9.firebasestorage.app",

    messagingSenderId:
        "904310961712",

    appId:
        "1:904310961712:web:178e457e45db1136d85ff5",

    measurementId:
        "G-KXMD8DQS2X"

};


/* =====================================================
   INIT
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let notificationsUnsubscribe =
    null;

let ordersUnsubscribe =
    null;

let currentNotifications = [];

let currentOrders = [];


/* =====================================================
   ELEMENTS
===================================================== */

const profileImage =
    document.getElementById(
        "profile-image"
    );

const profileName =
    document.getElementById(
        "profile-name"
    );

const profileProvider =
    document.getElementById(
        "profile-provider"
    );

const accountName =
    document.getElementById(
        "account-name"
    );

const accountPhone =
    document.getElementById(
        "account-phone"
    );

const accountEmail =
    document.getElementById(
        "account-email"
    );

const accountLoginMethod =
    document.getElementById(
        "account-login-method"
    );

const ordersList =
    document.getElementById(
        "orders-list"
    );

const ordersCount =
    document.getElementById(
        "orders-count"
    );

const logoutButton =
    document.getElementById(
        "logout-button"
    );

const editNameButton =
    document.getElementById(
        "edit-name-button"
    );


/* Notifications */

const notificationButton =
    document.getElementById(
        "notification-button"
    );

const notificationBadge =
    document.getElementById(
        "notification-badge"
    );

const notificationsPanel =
    document.getElementById(
        "notifications-panel"
    );

const notificationsList =
    document.getElementById(
        "notifications-list"
    );

const markAllButton =
    document.getElementById(
        "mark-all-button"
    );


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    function(user) {


        if (!user) {

            stopListeners();

            localStorage.removeItem(
                "myStoreCurrentUser"
            );

            window.location.href =
                "auth.html";

            return;

        }


        currentUser =
            user;


        saveCurrentUser(
            user
        );


        showAccount(
            user
        );


        /*
           تشغيل الطلبات
        */

        loadOrdersFromFirestore(
            user
        );


        /*
           تشغيل الإشعارات
        */

        loadNotifications(
            user
        );

    }
);


/* =====================================================
   STOP LISTENERS
===================================================== */

function stopListeners() {

    if (
        notificationsUnsubscribe
    ) {

        notificationsUnsubscribe();

        notificationsUnsubscribe =
            null;

    }


    if (
        ordersUnsubscribe
    ) {

        ordersUnsubscribe();

        ordersUnsubscribe =
            null;

    }

}


/* =====================================================
   SAVE USER
===================================================== */

function saveCurrentUser(user) {

    const providerData =
        user.providerData &&
        user.providerData.length
            ? user.providerData[0]
            : null;


    const providerId =
        providerData
            ? providerData.providerId
            : "";


    const userData = {

        uid:
            user.uid,

        name:
            user.displayName ||
            "مستخدم المتجر",

        phone:
            user.phoneNumber ||
            "",

        email:
            user.email ||
            "",

        photo:
            user.photoURL ||
            "",

        provider:
            providerId

    };


    localStorage.setItem(
        "myStoreCurrentUser",
        JSON.stringify(
            userData
        )
    );

}


/* =====================================================
   SHOW ACCOUNT
===================================================== */

function showAccount(user) {

    const name =
        user.displayName ||
        "مستخدم المتجر";


    profileName.textContent =
        name;


    accountName.textContent =
        name;


    accountPhone.textContent =
        user.phoneNumber ||
        "غير مرتبط";


    accountEmail.textContent =
        user.email ||
        "غير مرتبط";


    accountLoginMethod.textContent =
        getLoginMethod(
            user
        );


    profileProvider.textContent =
        getLoginMethod(
            user
        );


    if (
        user.photoURL
    ) {

        profileImage.innerHTML =

            `<img
                src="${escapeHtml(
                    user.photoURL
                )}"
                alt="صورة الحساب"
            >`;

    } else {

        profileImage.textContent =
            "👤";

    }

}


/* =====================================================
   FIRESTORE ORDERS
===================================================== */

function loadOrdersFromFirestore(
    user
) {


    /*
       البحث باستخدام userId
    */

    try {

        const ordersQuery =
            query(
                collection(
                    db,
                    "orders"
                ),
                where(
                    "userId",
                    "==",
                    user.uid
                )
            );


        ordersUnsubscribe =
            onSnapshot(
                ordersQuery,

                function(snapshot) {


                    currentOrders =
                        snapshot.docs
                            .map(
                                function(
                                    item
                                ) {

                                    return {

                                        id:
                                            item.id,

                                        ...item.data()

                                    };

                                }
                            );


                    /*
                       ترتيب الأحدث أولًا
                    */

                    currentOrders.sort(
                        function(a,b) {

                            return (
                                getOrderDateValue(b)
                                -
                                getOrderDateValue(a)
                            );

                        }
                    );


                    /*
                       حفظ نسخة محلية
                    */

                    try {

                        localStorage.setItem(
                            "myStoreOrders",
                            JSON.stringify(
                                currentOrders
                            )
                        );

                    } catch(error) {

                        console.warn(
                            "تعذر حفظ الطلبات محليًا.",
                            error
                        );

                    }


                    renderOrders(
                        currentOrders
                    );

                },

                function(error) {

                    console.error(
                        "Orders Firestore error:",
                        error
                    );


                    /*
                       fallback
                    */

                    loadOrdersFromLocalStorage(
                        user
                    );

                }
            );


    } catch(error) {

        console.error(
            error
        );


        loadOrdersFromLocalStorage(
            user
        );

    }

}


/* =====================================================
   FALLBACK ORDERS
===================================================== */

function loadOrdersFromLocalStorage(
    user
) {

    let orders = [];


    try {

        orders =
            JSON.parse(
                localStorage.getItem(
                    "myStoreOrders"
                )
            ) || [];

    } catch(error) {

        orders = [];

    }


    const userOrders =
        orders.filter(
            function(order) {


                if (
                    order.userId &&
                    order.userId ===
                    user.uid
                ) {

                    return true;

                }


                if (
                    order.customerEmail &&
                    user.email &&
                    order.customerEmail
                        .toLowerCase() ===
                    user.email.toLowerCase()
                ) {

                    return true;

                }


                if (
                    order.customerPhone &&
                    user.phoneNumber &&
                    normalizePhone(
                        order.customerPhone
                    ) ===
                    normalizePhone(
                        user.phoneNumber
                    )
                ) {

                    return true;

                }


                return false;

            }
        );


    userOrders.sort(
        function(a,b) {

            return (
                getOrderDateValue(b)
                -
                getOrderDateValue(a)
            );

        }
    );


    currentOrders =
        userOrders;


    renderOrders(
        userOrders
    );

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
    orders
) {


    orders =
        Array.isArray(orders)
            ? orders
            : [];


    ordersCount.textContent =
        orders.length +
        " طلب";


    if (
        orders.length === 0
    ) {

        ordersList.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    📦
                </div>

                <strong>
                    لا توجد طلبات حتى الآن
                </strong>

                <span>
                    عندما تقوم بإجراء طلب،
                    سيظهر هنا مع رقم الطلب وحالته.
                </span>

                <br>

                <a
                    href="index.html#products"
                    class="shop-button"
                >
                    🛍️ ابدأ التسوق
                </a>

            </div>

        `;

        return;

    }


    ordersList.innerHTML =
        orders
            .map(
                renderOrder
            )
            .join("");

}


/* =====================================================
   RENDER ORDER
===================================================== */

function renderOrder(
    order
) {

    const status =
        normalizeStatus(
            order.status
        );


    const statusText =
        getStatusText(
            status
        );


    const statusClass =
        getStatusClass(
            status
        );


    const orderNumber =
        order.orderNumber ||
        order.id ||
        order.orderId ||
        "طلب";


    const date =
        formatDate(
            order.createdAt ||
            order.date
        );


    const items =
        Array.isArray(
            order.items
        )
            ? order.items
            : [];


    const itemsHtml =
        items.length

            ?

            items
                .map(
                    function(item) {

                        const quantity =
                            Number(
                                item.quantity ||
                                1
                            );


                        const price =
                            Number(
                                item.price ||
                                0
                            );


                        return `

                            <div class="order-item">

                                <div class="order-item-left">

                                    ${
                                        item.image

                                            ?

                                            `<img
                                                class="order-item-image"
                                                src="${escapeHtml(
                                                    item.image
                                                )}"
                                                alt=""
                                            >`

                                            :

                                            `<div
                                                class="order-item-image"
                                                style="
                                                    display:flex;
                                                    align-items:center;
                                                    justify-content:center;
                                                    font-size:24px;
                                                "
                                            >
                                                🛍️
                                            </div>`
                                    }


                                    <div>

                                        <div class="order-item-name">

                                            ${escapeHtml(
                                                item.name ||
                                                "منتج"
                                            )}

                                        </div>


                                        <div class="order-item-details">

                                            الكمية:
                                            ${quantity}

                                            ${
                                                item.size
                                                    ?

                                                    " | المقاس: "
                                                    +
                                                    escapeHtml(
                                                        item.size
                                                    )

                                                    :
                                                    ""
                                            }

                                            ${
                                                item.color
                                                    ?

                                                    " | اللون: "
                                                    +
                                                    escapeHtml(
                                                        item.color
                                                    )

                                                    :
                                                    ""
                                            }

                                        </div>

                                    </div>

                                </div>


                                <div class="order-item-price">

                                    ${formatPrice(
                                        price *
                                        quantity
                                    )}

                                </div>

                            </div>

                        `;

                    }
                )
                .join("")

            :

            `

                <div class="order-item-details">

                    تفاصيل المنتجات غير متوفرة.

                </div>

            `;


    const total =
        Number(
            order.total ||
            0
        );


    return `

        <article
            class="order-card"
            data-order-id="${escapeHtml(
                order.id || ""
            )}"
        >


            <div class="order-header">

                <div>

                    <div class="order-number">

                        📦 رقم الطلب:

                        ${escapeHtml(
                            String(
                                orderNumber
                            )
                        )}

                    </div>


                    <div class="order-date">

                        ${date}

                    </div>

                </div>


                <span
                    class="status ${statusClass}"
                >

                    ${statusText}

                </span>

            </div>


            <div class="order-items">

                ${itemsHtml}

            </div>


            <div class="order-footer">

                <span
                    class="order-total-label"
                >
                    إجمالي الطلب
                </span>


                <strong
                    class="order-total"
                >

                    ${formatPrice(
                        total
                    )}

                </strong>

            </div>


        </article>

    `;

}


/* =====================================================
   🔔 LOAD NOTIFICATIONS
===================================================== */

function loadNotifications(
    user
) {

    try {

        const notificationsQuery =
            query(
                collection(
                    db,
                    "notifications"
                ),
                where(
                    "userId",
                    "==",
                    user.uid
                )
            );


        notificationsUnsubscribe =
            onSnapshot(
                notificationsQuery,

                function(snapshot) {


                    currentNotifications =
                        snapshot.docs
                            .map(
                                function(item) {

                                    return {

                                        id:
                                            item.id,

                                        ...item.data()

                                    };

                                }
                            );


                    /*
                       الأحدث أولًا
                    */

                    currentNotifications.sort(
                        function(a,b) {

                            return (
                                getTimestampValue(
                                    b.createdAt
                                )
                                -
                                getTimestampValue(
                                    a.createdAt
                                )
                            );

                        }
                    );


                    renderNotifications(
                        currentNotifications
                    );

                },

                function(error) {

                    console.error(
                        "Notifications error:",
                        error
                    );


                    notificationsList.innerHTML = `

                        <div class="empty-notifications">

                            <div class="empty-notifications-icon">
                                ⚠️
                            </div>

                            تعذر تحميل الإشعارات

                        </div>

                    `;

                }
            );


    } catch(error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   🔔 RENDER NOTIFICATIONS
===================================================== */

function renderNotifications(
    notifications
) {


    const unreadCount =
        notifications.filter(
            function(notification) {

                return (
                    notification.read !== true
                );

            }
        ).length;


    /*
       تحديث الرقم
    */

    if (
        unreadCount > 0
    ) {

        notificationBadge.textContent =
            unreadCount > 99
                ? "99+"
                : unreadCount;


        notificationBadge.classList.add(
            "show"
        );

    } else {

        notificationBadge.classList.remove(
            "show"
        );

    }


    /*
       لا توجد إشعارات
    */

    if (
        notifications.length === 0
    ) {

        notificationsList.innerHTML = `

            <div class="empty-notifications">

                <div class="empty-notifications-icon">
                    🔕
                </div>

                لا توجد إشعارات حاليًا.

            </div>

        `;

        return;

    }


    notificationsList.innerHTML =
        notifications
            .map(
                renderNotification
            )
            .join("");

}


/* =====================================================
   🔔 NOTIFICATION CARD
===================================================== */

function renderNotification(
    notification
) {

    const unread =
        notification.read !== true;


    const title =
        notification.title ||
        "تحديث جديد";


    const message =
        notification.message ||
        "لديك إشعار جديد.";


    const time =
        formatNotificationTime(
            notification.createdAt
        );


    return `

        <div
            class="
                notification-item
                ${unread ? "unread" : ""}
            "
            data-id="${escapeHtml(
                notification.id
            )}"
            onclick="
                notificationClicked(
                    '${escapeJs(
                        notification.id
                    )}',
                    '${escapeJs(
                        notification.orderId ||
                        ""
                    )}'
                )
            "
        >


            <div class="notification-icon">

                🔔

            </div>


            <div class="notification-content">

                <div class="notification-title">

                    ${escapeHtml(
                        title
                    )}

                </div>


                <div class="notification-message">

                    ${escapeHtml(
                        message
                    )}

                </div>


                <div class="notification-time">

                    ${escapeHtml(
                        time
                    )}

                </div>

            </div>


            <button
                type="button"
                class="notification-delete"
                title="حذف"
                onclick="
                    event.stopPropagation();
                    deleteNotification(
                        '${escapeJs(
                            notification.id
                        )}'
                    )
                "
            >
                ×
            </button>


        </div>

    `;

}


/* =====================================================
   🔔 CLICK NOTIFICATION
===================================================== */

window.notificationClicked =
async function(
    notificationId,
    orderId
) {

    try {

        await markNotificationAsRead(
            notificationId
        );

    } catch(error) {

        console.error(
            error
        );

    }


    /*
       إغلاق القائمة
    */

    notificationsPanel.classList.remove(
        "show"
    );


    /*
       إذا الإشعار متعلق بطلب
    */

    if (
        orderId
    ) {

        const orderElement =
            document.querySelector(
                `[data-order-id="${CSS.escape(
                    orderId
                )}"]`
            );


        if (
            orderElement
        ) {

            orderElement.scrollIntoView(
                {
                    behavior:
                        "smooth",
                    block:
                        "center"
                }
            );

            orderElement.style.outline =
                "3px solid #2563eb";


            setTimeout(
                function() {

                    orderElement.style.outline =
                        "";

                },
                2000
            );

        }

    }

};
