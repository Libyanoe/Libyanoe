<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حسابي - متجر الرياضة</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fa;
            color: #18202a;
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ================= HEADER ================= */

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e7eaf0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-button,
        .logout-button {
            border: 0;
            border-radius: 12px;
            padding: 10px 15px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .back-button {
            background: #f0f2f5;
            color: #18202a;
        }

        .logout-button {
            background: #18202a;
            color: white;
        }

        .logout-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: min(950px, calc(100% - 30px));
            margin: 30px auto 60px;
        }

        /* ================= LOADING ================= */

        .loading {
            background: white;
            border-radius: 20px;
            padding: 45px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.05);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #18202a;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= ACCOUNT ================= */

        .account-card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
            margin-bottom: 25px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef1f5;
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        .profile-placeholder {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #18202a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .profile-provider {
            color: #737b87;
            font-size: 14px;
        }

        .edit-button {
            border: 0;
            background: #f0f2f5;
            color: #18202a;
            padding: 10px 14px;
            border-radius: 11px;
            font-weight: 700;
        }

        .edit-button:hover {
            background: #e4e7eb;
        }

        .edit-area {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #edf0f3;
        }

        .edit-area.active {
            display: block;
        }

        .edit-row {
            display: flex;
            gap: 10px;
        }

        .edit-input {
            flex: 1;
            border: 1px solid #dce1e7;
            border-radius: 12px;
            padding: 13px;
            outline: none;
            font-size: 15px;
        }

        .edit-input:focus {
            border-color: #18202a;
        }

        .save-name-button {
            border: 0;
            border-radius: 12px;
            background: #18202a;
            color: white;
            padding: 0 18px;
            font-weight: 700;
        }

        /* ================= INFO ================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-box {
            background: #f7f8fa;
            border-radius: 14px;
            padding: 15px;
        }

        .info-label {
            color: #7b8490;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .info-value {
            font-weight: 700;
            word-break: break-word;
        }

        /* ================= SECTION ================= */

        .section {
            background: white;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
            margin-bottom: 25px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title h2 {
            font-size: 20px;
        }

        .orders-count {
            background: #f0f2f5;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* ================= ORDERS ================= */

        .order-card {
            border: 1px solid #e8ebef;
            border-radius: 17px;
            padding: 17px;
            margin-bottom: 13px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .order-number {
            font-weight: 800;
        }

        .order-date {
            color: #7b8490;
            font-size: 12px;
            margin-top: 4px;
        }

        .status {
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff4d6;
            color: #936d00;
        }

        .status-confirmed {
            background: #e7f6eb;
            color: #24713a;
        }

        .status-preparing {
            background: #eaf1ff;
            color: #315fa8;
        }

        .status-ready {
            background: #e8f7f5;
            color: #17766d;
        }

        .status-shipping {
            background: #e9f3ff;
            color: #1767a8;
        }

        .status-delivered {
            background: #e5f7e8;
            color: #16702b;
        }

        .status-cancelled {
            background: #ffe7e7;
            color: #a52a2a;
        }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 9px;
            border-radius: 11px;
        }

        .order-item-image {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 9px;
            background: #e9edf1;
        }

        .order-item-info {
            flex: 1;
            min-width: 0;
        }

        .order-item-name {
            font-weight: 700;
            font-size: 14px;
            word-break: break-word;
        }

        .order-item-details {
            color: #7a828d;
            font-size: 12px;
            margin-top: 3px;
        }

        .order-item-price {
            font-weight: 800;
            white-space: nowrap;
        }

        .order-bottom {
            border-top: 1px solid #edf0f2;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            color: #747d88;
        }

        .total-price {
            font-size: 19px;
            font-weight: 900;
        }

        .empty {
            text-align: center;
            color: #7b8490;
            padding: 30px 10px;
        }

        /* ================= ERROR ================= */

        .message {
            display: none;
            border-radius: 13px;
            padding: 13px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 700;
        }

        .message.error {
            display: block;
            background: #ffe9e9;
            color: #9c2b2b;
        }

        .message.success {
            display: block;
            background: #e8f7eb;
            color: #24713a;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 650px) {

            .header {
                padding: 0 12px;
            }

            .header-title {
                font-size: 17px;
            }

            .back-button span,
            .logout-button span {
                display: none;
            }

            .container {
                width: min(100% - 20px, 950px);
                margin-top: 18px;
            }

            .account-card,
            .section {
                padding: 18px;
                border-radius: 18px;
            }

            .profile {
                align-items: flex-start;
            }

            .profile-name {
                font-size: 19px;
            }

            .edit-button {
                padding: 8px 10px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .edit-row {
                flex-direction: column;
            }

            .save-name-button {
                height: 45px;
            }

            .order-top {
                align-items: flex-start;
            }

            .order-item-price {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-title">
        👤 حسابي
    </div>

    <div class="header-actions">

        <a href="index.html" class="back-button">
            🏠 <span>المتجر</span>
        </a>

        <button
            type="button"
            class="logout-button"
            id="logout-button">
            🚪 <span>تسجيل الخروج</span>
        </button>

    </div>

</header>


<main class="container">

    <!-- LOADING -->

    <div id="loading" class="loading">

        <div class="spinner"></div>

        <p>جاري تحميل بيانات الحساب...</p>

    </div>


    <!-- MESSAGE -->

    <div id="message" class="message"></div>


    <!-- ACCOUNT -->

    <div id="account-content" style="display:none;">

        <section class="account-card">

            <div class="profile">

                <div id="profile-photo-container"></div>

                <div class="profile-info">

                    <div
                        class="profile-name"
                        id="profile-name">
                        -
                    </div>

                    <div
                        class="profile-provider"
                        id="profile-provider">
                        -
                    </div>

                </div>

                <button
                    type="button"
                    class="edit-button"
                    id="edit-button">
                    ✏️ تعديل
                </button>

            </div>


            <!-- EDIT NAME -->

            <div
                class="edit-area"
                id="edit-area">

                <div class="edit-row">

                    <input
                        type="text"
                        id="name-input"
                        class="edit-input"
                        placeholder="اكتب اسمك"
                        maxlength="50">

                    <button
                        type="button"
                        class="save-name-button"
                        id="save-name-button">
                        حفظ
                    </button>

                </div>

            </div>


            <!-- INFO -->

            <div class="info-grid">

                <div class="info-box">

                    <div class="info-label">
                        📧 البريد الإلكتروني
                    </div>

                    <div
                        class="info-value"
                        id="email">
                        -
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        📱 رقم الهاتف
                    </div>

                    <div
                        class="info-value"
                        id="phone">
                        -
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        🔐 طريقة الدخول
                    </div>

                    <div
                        class="info-value"
                        id="login-method">
                        -
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        🆔 معرف الحساب
                    </div>

                    <div
                        class="info-value"
                        id="uid">
                        -
                    </div>

                </div>

            </div>

        </section>


        <!-- ORDERS -->

        <section class="section">

            <div class="section-title">

                <h2>
                    📦 طلباتي
                </h2>

                <span
                    class="orders-count"
                    id="orders-count">
                    0 طلب
                </span>

            </div>


            <div id="orders-list">

                <div class="empty">
                    لا توجد طلبات حتى الآن
                </div>

            </div>

        </section>

    </div>

</main>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDbdvEYLluTTT7Ti8gikDCBHkf53_07kMs",

    authDomain:
        "suhayeb-25ef9.firebaseapp.com",

    projectId:
        "suhayeb-25ef9",

    storageBucket:
        "suhayeb-25ef9.firebasestorage.app",

    messagingSenderId:
        "904310961712",

    appId:
        "1:904310961712:web:178e457e45db1136d85ff5",

    measurementId:
        "G-KXMD8DQS2X"
};


/* =====================================================
   INITIALIZE
===================================================== */

let app;
let auth;
let db;
let currentUser = null;
let unsubscribeOrders = null;


try {

    app = initializeApp(firebaseConfig);

    auth = getAuth(app);

    db = getFirestore(app);

} catch (error) {

    console.error(
        "Firebase initialization error:",
        error
    );

    showMessage(
        "حدث خطأ في تشغيل Firebase. تأكد من إعدادات Firebase.",
        "error"
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const accountContent =
    document.getElementById("account-content");

const message =
    document.getElementById("message");

const profileName =
    document.getElementById("profile-name");

const profileProvider =
    document.getElementById("profile-provider");

const profilePhotoContainer =
    document.getElementById("profile-photo-container");

const emailElement =
    document.getElementById("email");

const phoneElement =
    document.getElementById("phone");

const loginMethod =
    document.getElementById("login-method");

const uidElement =
    document.getElementById("uid");

const editButton =
    document.getElementById("edit-button");

const editArea =
    document.getElementById("edit-area");

const nameInput =
    document.getElementById("name-input");

const saveNameButton =
    document.getElementById("save-name-button");

const logoutButton =
    document.getElementById("logout-button");

const ordersList =
    document.getElementById("orders-list");

const ordersCount =
    document.getElementById("orders-count");


/* =====================================================
   AUTH STATE
===================================================== */

if (auth) {

    onAuthStateChanged(
        auth,
        async function(user) {

            console.log(
                "Auth state:",
                user
            );

            if (!user) {

                currentUser = null;

                window.location.href =
                    "auth.html";

                return;
            }

            currentUser = user;

            try {

                /*
                   نجبر Firebase على تحديث
                   بيانات المستخدم الحالية.
                */

                await user.reload();

            } catch (error) {

                console.warn(
                    "User reload failed:",
                    error
                );

            }

            /*
               user قد يتم تحديثه بعد reload
            */

            currentUser =
                auth.currentUser || user;

            showAccount(
                currentUser
            );

            loadOrders(
                currentUser
            );

        }
    );

}


/* =====================================================
   SHOW ACCOUNT
===================================================== */

function showAccount(user) {

    if (!user) {
        return;
    }


    loading.style.display =
        "none";

    accountContent.style.display =
        "block";


    const name =
        user.displayName ||
        localStorage.getItem(
            "myStoreUserName"
        ) ||
        "مستخدم المتجر";


    profileName.textContent =
        name;


    nameInput.value =
        name;


    emailElement.textContent =
        user.email ||
        "غير متوفر";


    phoneElement.textContent =
        user.phoneNumber ||
        "غير متوفر";


    uidElement.textContent =
        user.uid ||
        "غير متوفر";


    loginMethod.textContent =
        getLoginMethod(user);


    profileProvider.textContent =
        getLoginMethod(user);


    showProfileImage(
        user
    );


    /*
       نحفظ نسخة محلية من بيانات المستخدم
       حتى يستطيع الموقع استخدامها أيضاً.
    */

    localStorage.setItem(
        "myStoreCurrentUser",
        JSON.stringify({

            uid: user.uid,

            id: user.uid,

            name: name,

            displayName: name,

            email: user.email || "",

            phone: user.phoneNumber || "",

            photo: user.photoURL || "",

            photoURL: user.photoURL || "",

            provider:
                getLoginMethod(user)

        })
    );

}


/* =====================================================
   PROFILE IMAGE
===================================================== */

function showProfileImage(user) {

    profilePhotoContainer.innerHTML = "";


    if (user.photoURL) {

        const image =
            document.createElement("img");

        image.className =
            "profile-image";

        image.src =
            user.photoURL;

        image.alt =
            "صورة الحساب";

        image.onerror =
            function() {

                showProfilePlaceholder(
                    user
                );

            };

        profilePhotoContainer.appendChild(
            image
        );

    } else {

        showProfilePlaceholder(
            user
        );

    }

}


function showProfilePlaceholder(user) {

    const div =
        document.createElement("div");

    div.className =
        "profile-placeholder";

    const name =
        user.displayName ||
        "م";

    div.textContent =
        name.trim().charAt(0).toUpperCase();

    profilePhotoContainer.innerHTML =
        "";

    profilePhotoContainer.appendChild(
        div
    );

}


/* =====================================================
   LOGIN METHOD
===================================================== */

function getLoginMethod(user) {

    if (
        !user ||
        !user.providerData ||
        !user.providerData.length
    ) {

        return "Firebase";

    }


    const providers =
        user.providerData.map(
            item => item.providerId
        );


    if (
        providers.includes(
            "google.com"
        )
    ) {

        return "Google";

    }


    if (
        providers.includes(
            "phone"
        )
    ) {

        return "رقم الهاتف";

    }


    if (
        providers.includes(
            "password"
        )
    ) {

        return "البريد الإلكتروني";

    }


    return "Firebase";

}


/* =====================================================
   EDIT BUTTON
===================================================== */

editButton.addEventListener(
    "click",
    function() {

        editArea.classList.toggle(
            "active"
        );

        if (
            editArea.classList.contains(
                "active"
            )
        ) {

            nameInput.focus();

        }

    }
);


/* =====================================================
   SAVE NAME
===================================================== */

saveNameButton.addEventListener(
    "click",
    saveName
);


nameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            saveName();

        }

    }
);


async function saveName() {

    if (!currentUser) {

        showMessage(
            "لم يتم العثور على الحساب.",
            "error"
        );

        return;

    }


    const newName =
        nameInput.value.trim();


    if (!newName) {

        showMessage(
            "اكتب الاسم أولاً.",
            "error"
        );

        return;

    }


    if (newName.length < 2) {

        showMessage(
            "الاسم يجب أن يكون حرفين على الأقل.",
            "error"
        );

        return;

    }


    saveNameButton.disabled =
        true;

    saveNameButton.textContent =
        "جاري الحفظ...";


    try {

        /*
           تحديث الاسم في Firebase
        */

        await updateProfile(
            currentUser,
            {
                displayName:
                    newName
            }
        );


        /*
           تحديث النسخة المحلية
        */

        localStorage.setItem(
            "myStoreUserName",
            newName
        );


        localStorage.setItem(
            "myStoreCurrentUser",
            JSON.stringify({

                uid:
                    currentUser.uid,

                id:
                    currentUser.uid,

                name:
                    newName,

                displayName:
                    newName,

                email:
                    currentUser.email || "",

                phone:
                    currentUser.phoneNumber || "",

                photo:
                    currentUser.photoURL || "",

                photoURL:
                    currentUser.photoURL || "",

                provider:
                    getLoginMethod(
                        currentUser
                    )

            })
        );


        /*
           تحديث الواجهة فوراً
        */

        profileName.textContent =
            newName;

        profileProvider.textContent =
            getLoginMethod(
                currentUser
            );


        editArea.classList.remove(
            "active"
        );


        showMessage(
            "تم تحديث الاسم بنجاح ✅",
            "success"
        );


    } catch (error) {

        console.error(
            "Update profile error:",
            error
        );


        showMessage(
            getFirebaseError(
                error
            ),
            "error"
        );

    }


    saveNameButton.disabled =
        false;

    saveNameButton.textContent =
        "حفظ";

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function() {

        if (!auth) {

            window.location.href =
                "auth.html";

            return;

        }


        logoutButton.disabled =
            true;

        logoutButton.innerHTML =
            "⏳ جاري تسجيل الخروج...";


        try {

            if (unsubscribeOrders) {

                unsubscribeOrders();

                unsubscribeOrders =
                    null;

            }


            /*
               تسجيل الخروج من Firebase
            */

            await signOut(
                auth
            );


            /*
               تنظيف بيانات المستخدم المحلية فقط.
               لا نحذف السلة.
            */

            localStorage.removeItem(
                "myStoreCurrentUser"
            );

            localStorage.removeItem(
                "myStoreUserName"
            );


            /*
               الذهاب لصفحة تسجيل الدخول
            */

            window.location.replace(
                "auth.html"
            );


        } catch (error) {

            console.error(
                "Logout error:",
                error
            );


            showMessage(
                "تعذر تسجيل الخروج: " +
                (
                    error.message ||
                    "خطأ غير معروف"
                ),
                "error"
            );


            logoutButton.disabled =
                false;

            logoutButton.innerHTML =
                "🚪 <span>تسجيل الخروج</span>";

        }

    }
);


/* =====================================================
   LOAD ORDERS
===================================================== */

function loadOrders(user) {

    if (!user) {
        return;
    }


    /*
       أولاً نعرض الطلبات الموجودة محلياً.
       هذا مهم لأن الطلبات القديمة قد تكون
       محفوظة في localStorage.
    */

    renderLocalOrders(
        user
    );


    /*
       ثم نحاول تحميل طلبات Firestore.
    */

    if (!db) {
        return;
    }


    try {

        const ordersRef =
            collection(
                db,
                "orders"
            );


        const ordersQuery =
            query(
                ordersRef,
                where(
                    "userId",
                    "==",
                    user.uid
                )
            );


        unsubscribeOrders =
            onSnapshot(
                ordersQuery,
                function(snapshot) {

                    const firestoreOrders =
                        [];


                    snapshot.forEach(
                        function(docSnapshot) {

                            firestoreOrders.push({

                                id:
                                    docSnapshot.id,

                                ...docSnapshot.data()

                            });

                        }
                    );


                    /*
                       ندمج Firestore مع localStorage
                    */

                    const localOrders =
                        getLocalOrdersForUser(
                            user
                        );


                    const merged =
                        mergeOrders(
                            firestoreOrders,
                            localOrders
                        );


                    renderOrders(
                        merged
                    );

                },
                function(error) {

                    console.warn(
                        "Firestore orders error:",
                        error
                    );

                    /*
                       لو Firestore رفض القراءة
                       نعرض الطلبات المحلية.
                    */

                    renderLocalOrders(
                        user
                    );

                }
            );

    } catch (error) {

        console.warn(
            "Orders query error:",
            error
        );

        renderLocalOrders(
            user
        );

    }

}


/* =====================================================
   LOCAL ORDERS
===================================================== */

function getLocalOrdersForUser(user) {

    let orders = [];


    try {

        const raw =
            localStorage.getItem(
                "myStoreOrders"
            );


        if (raw) {

            const parsed =
                JSON.parse(raw);


            if (
                Array.isArray(parsed)
            ) {

                orders = parsed;

            }

        }

    } catch (error) {

        console.warn(
            "Local orders error:",
            error
        );

    }


    const userUid =
        String(
            user.uid || ""
        );


    const userEmail =
        String(
            user.email || ""
        ).trim().toLowerCase();


    const userPhone =
        normalizePhone(
            user.phoneNumber || ""
        );


    return orders.filter(
        function(order) {

            const orderUid =
                String(
                    order.userId ||
                    ""
                );


            const orderEmail =
                String(
                    order.customerEmail ||
                    order.email ||
                    ""
                )
                .trim()
                .toLowerCase();


            const orderPhone =
                normalizePhone(
                    order.customerPhone ||
                    order.phone ||
                    ""
                );


            return (

                (
                    orderUid &&
                    orderUid === userUid
                )

                ||

                (
                    userEmail &&
                    orderEmail &&
                    userEmail === orderEmail
                )

                ||

                (
                    userPhone &&
                    orderPhone &&
                    userPhone === orderPhone
                )

            );

        }
    );

}


function renderLocalOrders(user) {

    const orders =
        getLocalOrdersForUser(
            user
        );


    renderOrders(
        orders
    );

}


/* =====================================================
   MERGE ORDERS
===================================================== */

function mergeOrders(
    firestoreOrders,
    localOrders
) {

    const result = [];
    const keys = new Set();


    [
        ...firestoreOrders,
        ...localOrders
    ].forEach(
        function(order) {

            const key =
                String(
                    order.orderNumber ||
                    order.orderId ||
                    order.id ||
                    (
                        order.createdAt ||
                        order.date ||
                        ""
                    )
                );


            if (
                !keys.has(key)
            ) {

                keys.add(key);

                result.push(
                    order
                );

            }

        }
    );


    result.sort(
        function(a, b) {

            const dateA =
                getDateValue(
                    a.createdAt ||
                    a.date
                );

            const dateB =
                getDateValue(
                    b.createdAt ||
                    b.date
                );

            return dateB - dateA;

        }
    );


    return result;

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders) {

    if (!Array.isArray(orders)) {

        orders = [];

    }


    ordersCount.textContent =
        orders.length +
        (
            orders.length === 1
                ? " طلب"
                : " طلبات"
        );


    if (!orders.length) {

        ordersList.innerHTML = `
            <div class="empty">
                📦 لا توجد طلبات حتى الآن
            </div>
        `;

        return;

    }


    ordersList.innerHTML = "";


    orders.forEach(
        function(order) {

            ordersList.appendChild(
                createOrderCard(
                    order
                )
            );

        }
    );

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(order) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "order-card";


    const orderNumber =
        order.orderNumber ||
        order.id ||
        order.orderId ||
        "طلب";


    const status =
        normalizeStatus(
            order.status
        );


    const statusText =
        getStatusText(
            status
        );


    const statusClass =
        "status-" +
        status;


    const date =
        formatDate(
            order.createdAt ||
            order.date
        );


    const items =
        Array.isArray(
            order.items
        )
            ? order.items
            : [];


    const total =
        Number(
            order.total || 0
        );


    const top =
        document.createElement(
            "div"
        );

    top.className =
        "order-top";


    const titleBox =
        document.createElement(
            "div"
        );


    const numberElement =
        document.createElement(
            "div"
        );

    numberElement.className =
        "order-number";

    numberElement.textContent =
        "🔢 " + orderNumber;


    const dateElement =
        document.createElement(
            "div"
        );

    dateElement.className =
        "order-date";

    dateElement.textContent =
        date;


    titleBox.appendChild(
        numberElement
    );

    titleBox.appendChild(
        dateElement
    );


    const statusElement =
        document.createElement(
            "span"
        );

    statusElement.className =
        "status " +
        statusClass;

    statusElement.textContent =
        statusText;


    top.appendChild(
        titleBox
    );

    top.appendChild(
        statusElement
    );


    card.appendChild(
        top
    );


    const itemsContainer =
        document.createElement(
            "div"
        );

    itemsContainer.className =
        "order-items";


    if (!items.length) {

        const emptyItems =
            document.createElement(
                "div"
            );

        emptyItems.className =
            "empty";

        emptyItems.textContent =
            "لا توجد تفاصيل للمنتجات";

        itemsContainer.appendChild(
            emptyItems
        );

    } else {

        items.forEach(
            function(item) {

                const itemElement =
                    document.createElement(
                        "div"
                    );

                itemElement.className =
                    "order-item";


                if (item.image) {

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.className =
                        "order-item-image";

                    image.src =
                        item.image;

                    image.alt =
                        item.name ||
                        "منتج";

                    itemElement.appendChild(
                        image
                    );

                } else {

                    const placeholder =
                        document.createElement(
                            "div"
                        );

                    placeholder.className =
                        "order-item-image";

                    placeholder.style.display =
                        "flex";

                    placeholder.style.alignItems =
                        "center";

                    placeholder.style.justifyContent =
                        "center";

                    placeholder.textContent =
                        "🛍️";

                    itemElement.appendChild(
                        placeholder
                    );

                }


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "order-item-info";


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "order-item-name";

                name.textContent =
                    item.name ||
                    "منتج";


                const details =
                    document.createElement(
                        "div"
                    );

                details.className =
                    "order-item-details";


                const quantity =
                    Number(
                        item.quantity || 1
                    );


                let detailText =
                    "الكمية: " +
                    quantity;


                if (item.size) {

                    detailText +=
                        " • المقاس: " +
                        item.size;

                }


                if (item.color) {

                    detailText +=
                        " • اللون: " +
                        item.color;

                }


                details.textContent =
                    detailText;


                info.appendChild(
                    name
                );

                info.appendChild(
                    details
                );


                const price =
                    document.createElement(
                        "div"
                    );

                price.className =
                    "order-item-price";

                price.textContent =
                    formatPrice(
                        Number(
                            item.price || 0
                        ) *
                        quantity
                    );


                itemElement.appendChild(
                    info
                );

                itemElement.appendChild(
                    price
                );


                itemsContainer.appendChild(
                    itemElement
                );

            }
        );

    }


    card.appendChild(
        itemsContainer
    );


    const bottom =
        document.createElement(
            "div"
        );

    bottom.className =
        "order-bottom";


    const totalLabel =
        document.createElement(
            "span"
        );

    totalLabel.className =
        "total-label";

    totalLabel.textContent =
        "الإجمالي";


    const totalPrice =
        document.createElement(
            "span"
        );

    totalPrice.className =
        "total-price";

    totalPrice.textContent =
        formatPrice(
            total
        );


    bottom.appendChild(
        totalLabel
    );

    bottom.appendChild(
        totalPrice
    );


    card.appendChild(
        bottom
    );


    return card;

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status) {

    const value =
        String(
            status || ""
        )
        .trim()
        .toLowerCase();


    const map = {

        "جديد":
            "pending",

        "قيد المراجعة":
            "pending",

        "pending":
            "pending",

        "confirmed":
            "confirmed",

        "تم التأكيد":
            "confirmed",

        "preparing":
            "preparing",

        "جاري التجهيز":
            "preparing",

        "ready":
            "ready",

        "جاهز":
            "ready",

        "shipping":
            "shipping",

        "في التوصيل":
            "shipping",

        "delivered":
            "delivered",

        "تم التسليم":
            "delivered",

        "cancelled":
            "cancelled",

        "ملغي":
            "cancelled"

    };


    return (
        map[value] ||
        "pending"
    );

}


function getStatusText(status) {

    const map = {

        pending:
            "⏳ قيد المراجعة",

        confirmed:
            "✅ تم التأكيد",

        preparing:
            "📦 جاري التجهيز",

        ready:
            "📦 جاهز",

        shipping:
            "🚚 في التوصيل",

        delivered:
            "🎉 تم التسليم",

        cancelled:
            "❌ ملغي"

    };


    return (
        map[
            normalizeStatus(
                status
            )
        ] ||
        "⏳ قيد المراجعة"
    );

}


/* =====================================================
   HELPERS
===================================================== */

function normalizePhone(phone) {

    return String(
        phone || ""
    )
    .replace(
        /[^0-9]/g,
        ""
    )
    .replace(
        /^00218/,
        "218"
    )
    .replace(
        /^218/,
        "218"
    );

}


function formatPrice(price) {

    return (
        Number(
            price || 0
        ).toLocaleString(
            "ar-LY"
        ) +
        " د.ل"
    );

}


function getDateValue(value) {

    if (!value) {
        return 0;
    }


    if (
        typeof value === "object" &&
        typeof value.toDate === "function"
    ) {

        return value.toDate().getTime();

    }


    if (
        typeof value === "object" &&
        value.seconds
    ) {

        return (
            Number(
                value.seconds
            ) * 1000
        );

    }


    const date =
        new Date(value);


    return isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}


function formatDate(value) {

    const time =
        getDateValue(
            value
        );


    if (!time) {

        return "التاريخ غير متوفر";

    }


    return new Date(
        time
    ).toLocaleString(
        "ar-LY",
        {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " +
        (
            type === "success"
                ? "success"
                : "error"
        );


    clearTimeout(
        window.accountMessageTimer
    );


    window.accountMessageTimer =
        setTimeout(
            function() {

                message.className =
                    "message";

                message.textContent =
                    "";

            },
            5000
        );

}


function getFirebaseError(error) {

    if (!error) {

        return "حدث خطأ غير معروف.";

    }


    switch (
        error.code
    ) {

        case "auth/requires-recent-login":

            return "يجب تسجيل الدخول من جديد قبل تعديل الاسم.";

        case "auth/network-request-failed":

            return "تأكد من اتصال الإنترنت.";

        case "auth/user-token-expired":

            return "انتهت جلسة الدخول. سجّل الدخول من جديد.";

        case "auth/user-disabled":

            return "هذا الحساب معطل.";

        default:

            return (
                error.message ||
                "حدث خطأ أثناء العملية."
            );

    }

}
